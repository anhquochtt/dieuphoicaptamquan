    <input id="n1" type="password" inputmode="numeric" maxlength="4">

    <p class="err">${esc(msg||'')}</p>

async function doChange(){
  const a=$('#n1').value,b=$('#n2').value;
  if(a!==b)return viewChange('Hai lần nhập chưa khớp');
  const r=await rpc('change_pin',{...auth(),p_new:a});
  if(!r.ok)return viewChange(r.msg);
  S.pin=a;S.me.must_change=false;toast('Đã đổi PIN');load();
}

async function load(){
  const r=await rpc('board',auth());
  if(!r.ok){if(S.data)toast(r.msg);else viewLogin(r.msg);return}
  if(!S.areasOk){const a=await rpc('get_areas',auth());if(a.ok){S.areas=a.areas;S.areasOk=true}}
  if(r.kind==='TR'){const o=await rpc('tr_overview',{...auth(),p_day:null});if(o.ok)r.log=o.log.slice(0,12)}
  const [sb,ph,ob,tm]=await Promise.all([rpc('swap_board',auth()),(S.phonesDay!==r.day||S.phonesStale)?rpc('get_phones',auth()):null,rpc('office_board',auth()),rpc('team_board',auth())]);
  S.off=ob&&ob.ok?ob:null;S.team=tm&&tm.ok&&tm.teams.length?tm:null;
  S.sw=sb.ok?sb:{incoming:[],mine:[],notices:[],can_cancel:false};
  if(ph&&ph.ok){S.phones=ph.phones||{};S.phonesDay=r.day;S.phonesStale=0}
  const mt=r.rows.find(x=>x.code===r.code);
  if(mt&&mt.duty==='TB'&&mt.st===NU&&!S.autoTb[r.day]){
    S.autoTb[r.day]=1;
    const a=await rpc('set_status',{...auth(),p_target:r.code,p_st:'Trực ban',p_area:''});
    if(a.ok){mt.st='Trực ban';mt.at=new Date().toISOString();toast('Đã tự ghi: Trực ban')}
  }
  S.data=r;if(r.role==='ad'){const a=await rpc('admin_list',auth());if(a.ok)S.locked=a.officers.filter(o=>o.locked)}
  const vf={board:viewBoard,ov:()=>viewOverview(S.ovDay),mine:viewMine,stats:viewStats,org:viewOrg,team:viewTeam}[S.view];if(vf)vf();showIncoming();
  clearInterval(S.timer);S.timer=setInterval(()=>{if((S.view==='board'||S.view==='org'||S.view==='team')&&!$('#modal').innerHTML&&document.activeElement.id!=='q')load()},30000);
}

const ini=l=>((String(l||'?').trim().split(/\s+/).pop())||'?').charAt(0).toUpperCase();

function renderHeader(){
  const d=S.data;
  return `
    <div class="hd-bar">
      <div class="hd-user-tag">

        <span>${esc(d.label)}</span>

        <button class="ib" title="Thoát" onclick="logout()">${svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>')}</button>

function go(v){S.view=v;({board:viewBoard,ov:()=>viewOverview(),mine:viewMine,stats:viewStats,admin:viewAdmin,org:viewOrg,team:viewTeam})[v]()}
function renderNav(){
  const d=S.data,t=[['board',d.kind==='TR'?'Hôm nay':'Quân số']];
  if(d.kind==='TR')t.push(['ov','Các ngày']);
  if(d.role==='tb'||['CH','TR','QT'].includes(d.kind))t.push(['org','Toàn cơ quan']);

function setG(k){S.group=k;viewBoard()}

function viewBoard(){
  S.view='board';
  const d=S.data, rows=d.rows, cnt={}, f=S.filter;
  const me=rows.find(r=>r.code===d.code), nu=rows.filter(r=>r.st===NU);
  rows.forEach(r=>cnt[r.st]=(cnt[r.st]||0)+1);
  const doneCount = rows.length - nu.length;

  let h = renderHeader() + renderNav();

  if(me && PROOF.includes(me.st)){
    h += `<div class="alert"><span>Bạn đang ${esc(me.st)}. Gửi minh chứng cho trực ban.</span><button class="sm pill" onclick="proof()">Gửi Zalo</button></div>`;
  }
  
  h += swCards()+offAlert();

  if((['tb','ch','ad'].includes(d.role)||d.kind==='TR')&&rows.length){
    h += nu.length
      ? `<div class="alert"><span>${nu.length} cán bộ chưa khai báo.</span><button class="sm pill" onclick="nudge()">Nhắc cả ca</button><button class="sm pill sec" onclick="report()">Báo cáo</button></div>`
      : `<div class="alert" style="background:#ECFDF5;color:#047857;border-color:#D1FAE5"><span>Cả ca đã khai báo đủ.</span><button class="sm pill" onclick="nudge()">Gửi tổng hợp</button><button class="sm pill sec" onclick="report()">Báo cáo</button></div>`;
  }

  h += `<div class="card" style="padding-bottom:12px">
    <div class="hero-stat">
      <div class="mut" style="font-size:.78rem;font-weight:700;letter-spacing:0.05em">BẢNG QUÂN SỐ TỔNG THỂ</div>
      <div class="val">${rows.length}</div>
      <div class="badge-pill">Ngày trực: ${fmt(d.day)}</div>
    </div>
    ${renderDonut(doneCount, rows.length)}
    
    <div class="stat-cards-grid">
      ${Object.keys(cnt).slice(0,6).map(k=>`
        <div class="sc-item ${f===k?'on':''}" onclick="setF('${k}')">
          <div class="num">${cnt[k]}</div>
          <div class="lbl">${icon(k)} ${esc(k)}</div>
          <div class="bar-indicator" style="background:${col(k)}"></div>

      `).join('')}

  </div>`;

  if(me){
    h += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2>Cập nhật trạng thái</h2>
        <button class="sec sm pill" onclick="openSwap()">Đổi trực</button>
      </div>
      <div class="qg">
        ${ST.map(s=>`
          <button class="q ${me.st===s?'on':''}" onclick="quickSet('${s}')">
            <span style="color:${col(s)}">${icon(s)}</span>
            ${s}
          </button>
        `).join('')}
      </div>
      <div class="mut" style="margin-top:12px;text-align:center">
        Địa bàn hiện tại: <b>${me.area?esc(me.area):'Chưa chọn'}</b> · 
        <a href="#" onclick="edit('${esc(me.code)}');return false">Đổi địa bàn</a>${d.role==='tb'?(me.st==='Trực ban'?'<div style="margin-top:6px">Trực ban: tự ghi khi bạn đăng nhập.</div>':'<div style="margin-top:6px"><a href="#" onclick="quickSet(\'Trực ban\');return false">Quay lại Trực ban</a></div>'):''}
      </div>
    </div>`;
  }

  h += offSelf();
  h += `<div class="seg">
    <span class="mut" style="align-self:center;margin-right:4px">Nhóm:</span>
    ${[['duty','Nhiệm vụ'],['area','Địa bàn'],['st','Trạng thái']].map(([k,t])=>`
      <button class="${S.group===k?'on':''}" onclick="setG('${k}')">${t}</button>
    `).join('')}
    ${f?`<button class="sm" onclick="setF('')">Bỏ lọc ✕</button>`:''}
  </div>`;

  h += `<input type="search" id="q" placeholder="Tìm theo tên hoặc mã" value="${esc(S.q)}" oninput="setQ(this.value)" style="margin:0 0 8px">`;
  const list=rows.filter(r=>!f||r.st===f);
  const gk=r=>S.group==='area'?(r.area||'Chưa ghi địa bàn'):S.group==='st'?r.st:DUTY[r.duty];
  const g={};
  list.forEach(r=>(g[gk(r)]=g[gk(r)]||[]).push(r));

  h += rows.length ? Object.keys(g).map(k=>`

  app.innerHTML = h;if(S.q)applyQ();

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function setQ(v){S.q=v;applyQ()}
function applyQ(){
  const q=norm(S.q).trim();
  document.querySelectorAll('.item[data-s]').forEach(e=>e.style.display=!q||e.dataset.s.includes(q)?'':'none');
  document.querySelectorAll('.gh').forEach(g=>{let n=g.nextElementSibling,any=false;while(n&&!n.classList.contains('gh')){if(n.dataset.s!==undefined&&n.style.display!=='none')any=true;n=n.nextElementSibling}g.style.display=any?'':'none'});
}
async function shareText(msg,okm){
  if(navigator.share){try{await navigator.share({text:msg});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(msg);toast(okm||'Đã chép, dán vào Zalo')}catch(e){toast('Hãy tự chép nội dung vào Zalo')}
}
function report(){
  const d=S.data,rows=d.rows,nu=rows.filter(r=>r.st===NU).length;
  let m=`BÁO CÁO QUÂN SỐ TRỰC ${fmt(d.day)} (lúc ${nowT()})\nTổng: ${rows.length} người, chưa khai báo: ${nu}.`;
  ['CH','TB','TC'].forEach(k=>{const L=rows.filter(r=>r.duty===k);if(L.length)m+=`\n${DUTY[k]} (${L.length}):`+L.map(r=>`\n- ${r.label} (${r.code}): ${r.st}${r.area?' - '+r.area:''}`).join('')});
  shareText(m,'Đã chép báo cáo, dán vào Zalo');
}

const SWST={wait:'Chờ trả lời',done:'Đã đổi',declined:'Bị từ chối',cancelled:'Đã hủy'};
function swText(w){
  const f=esc(w.from_label),t=esc(w.to_label);
  if(w.kind==='DV')return `<b>${f}</b> đổi vai với <b>${t}</b> ngày ${fmt(w.day_from)}: ${f} sang trực chiến, ${t} sang trực ban`;
  if(w.kind==='NC')return `<b>${f}</b> nhượng ca ${fmt(w.day_from)} (${DUTY[w.duty_from]||''}) cho <b>${t}</b>`;
  return `<b>${f}</b> đổi ca ${fmt(w.day_from)} lấy ca ${fmt(w.day_to)} của <b>${t}</b>`;
}
function swCards(){
  const s=S.sw;let h='';
  if(s.incoming.length)h+=`<div class="alert" style="background:#EFF6FF;color:#1E40AF;border-color:#DBEAFE"><span>${s.incoming.length} yêu cầu đổi trực đang chờ bạn trả lời.</span><button class="sm pill" style="background:#2563EB" onclick="showIncoming(true)">Xem</button></div>`;
  if(s.notices.length)h+=`<div class="card"><h2>Đổi trực gần đây</h2>${s.notices.map(w=>`<div style="padding:8px 0;border-top:1px solid var(--border);font-size:.82rem">${swText(w)}${w.status==='cancelled'?' <span class="me" style="background:#FEF2F2;color:#DC2626">Đã hủy</span>':''}${w.reason?`<div class="mut">Lý do: ${esc(w.reason)}</div>`:''}${s.can_cancel&&w.status==='done'?`<div><button class="sm pill sec" style="margin-top:6px" onclick="cancelSwap(${w.id})">Hủy đổi</button></div>`:''}</div>`).join('')}</div>`;
  return h;
}
function showIncoming(force){
  const L=S.sw.incoming.filter(w=>force||!S.seen[w.id]);
  if(!L.length||($('#modal').innerHTML&&!force))return;
  L.forEach(w=>S.seen[w.id]=1);
  $('#modal').innerHTML=`<div class="ov"><div class="card" style="max-height:90vh;overflow:auto"><h2>Yêu cầu đổi trực</h2>${L.map(w=>`<div style="background:#F8FAFC;padding:12px;border-radius:12px;margin-bottom:10px;border:1px solid var(--border)">${swText(w)}<div class="mut">Lý do: ${esc(w.reason||'không ghi')}</div><div class="act" style="margin-top:8px"><button class="sm" onclick="answerSwap(${w.id},true)">Đồng ý</button><button class="sm sec" onclick="answerSwap(${w.id},false)">Từ chối</button></div></div>`).join('')}<button class="sec" style="width:100%" onclick="closeM()">Để sau</button></div></div>`;
}
async function answerSwap(id,ok){
  const r=await rpc('swap_answer',{...auth(),p_id:id,p_accept:ok});
  closeM();
  if(!r.ok)toast(r.msg);else toast(ok?'Đã nhận ca, lịch đã đổi':'Đã từ chối');
  S.phonesStale=1;load();
}
async function cancelSwap(id){
  if(!confirm('Hủy yêu cầu hoặc lần đổi trực này (lịch trả về như cũ)?'))return;
  const r=await rpc('swap_cancel',{...auth(),p_id:id});
  if(!r.ok)return toast(r.msg);
  toast('Đã hủy');S.phonesStale=1;load();
}

async function viewMine(){
  S.view='mine';
  const r=await rpc('my_schedule',auth());
  if(!r.ok){toast(r.msg);S.view='board';return}
  S.mySched=r.days;
  let h=renderHeader()+renderNav();
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2 style="margin:0">Ca trực sắp tới</h2><button class="sm pill" onclick="openSwap()">Đổi trực</button></div>`;
  h+=r.days.length?r.days.map(x=>{
    const pend=S.sw.mine.find(w=>w.status==='wait'&&w.from_code===S.data.code&&w.day_from===x.day);
    return `<div class="item" style="margin-top:8px"><div class="mid"><b>${fmt(x.day)}</b><div class="meta"><span class="dt">${DUTY[x.duty]||x.duty}</span><span class="mut">Ca ${esc(x.team)}</span></div>${pend?`<div class="area">Đang chờ ${esc(pend.to_label)} trả lời</div>`:''}</div><button class="sm pill sec" onclick="openSwap('${x.day}')">Đổi</button></div>`}).join('')
   :`<p class="mut">Bạn chưa có ca trực nào sắp tới trong lịch đã nhập.</p>`;
  h+=`</div>`;

  app.innerHTML=h;

async function openSwap(day){
  const [a,b]=await Promise.all([rpc('my_schedule',auth()),rpc('swap_people',auth())]);
  if(!a.ok||!b.ok)return toast((a.ok?b:a).msg);
  if(!a.days.length)return toast('Bạn chưa có ca trực sắp tới để đổi');
  S.mySched=a.days;S.people=b.people;
  S.swf={day:day||a.days[0].day,kind:'HD',to:'',dayTo:'',reason:''};
  renderSwap();
}
function swOpts(){
  const f=S.swf,mine=new Set(S.mySched.map(x=>x.day));
  return S.people.filter(p=>{
    const has=p.days.find(x=>x.day===f.day);
    if(f.kind==='DV')return has&&has.duty==='TC';
    if(has)return false;
    return f.kind==='NC'||p.days.some(x=>!mine.has(x.day));
  });
}
function renderSwap(){
  const f=S.swf,my=S.mySched.find(x=>x.day===f.day),canDV=my&&my.duty==='TB';
  if(f.kind==='DV'&&!canDV)f.kind='HD';
  const L=swOpts(),p=L.find(x=>x.code===f.to);
  if(!p){f.to='';f.dayTo=''}
  const days=p&&f.kind==='HD'?p.days.filter(x=>!S.mySched.some(m=>m.day===x.day)):[];
  if(f.kind==='HD'&&p&&!days.some(x=>x.day===f.dayTo))f.dayTo=days[0]?days[0].day:'';
  $('#modal').innerHTML=`<div class="ov"><div class="card" style="max-height:90vh;overflow:auto">
    <h2>Đổi trực</h2>
    <label class="mut">Ca của bạn</label>
    <select onchange="S.swf.day=this.value;renderSwap()">${S.mySched.map(x=>`<option value="${x.day}" ${x.day===f.day?'selected':''}>${fmt(x.day)} · ${DUTY[x.duty]||x.duty}</option>`).join('')}</select>
    <label class="mut" style="margin-top:10px;display:block">Kiểu đổi</label>
    <select onchange="S.swf.kind=this.value;renderSwap()">
      <option value="HD" ${f.kind==='HD'?'selected':''}>Hoán đổi: hai người đổi ca cho nhau</option>
      <option value="NC" ${f.kind==='NC'?'selected':''}>Nhượng ca: người kia nhận ca của bạn</option>
      ${canDV?`<option value="DV" ${f.kind==='DV'?'selected':''}>Đổi vai với trực chiến cùng ca</option>`:''}
    </select>
    <label class="mut" style="margin-top:10px;display:block">Người nhận</label>
    <select onchange="S.swf.to=this.value;renderSwap()"><option value="">(Chọn người)</option>${L.map(x=>`<option value="${esc(x.code)}" ${x.code===f.to?'selected':''}>${esc(x.label)} (${esc(x.code)})</option>`).join('')}</select>
    ${f.kind==='HD'&&p?`<label class="mut" style="margin-top:10px;display:block">Ca của ${esc(p.label)}</label><select onchange="S.swf.dayTo=this.value">${days.map(x=>`<option value="${x.day}" ${x.day===f.dayTo?'selected':''}>${fmt(x.day)} · ${DUTY[x.duty]||x.duty}</option>`).join('')}</select>`:''}
    ${f.kind==='DV'?'':`<label class="mut" style="margin-top:10px;display:block">Lý do</label><input maxlength="120" value="${esc(f.reason)}" oninput="S.swf.reason=this.value" placeholder="Ví dụ: việc gia đình">`}
    <p class="err" id="swe"></p>
    <div class="act"><button style="flex:1" onclick="submitSwap()">${f.kind==='DV'?'Đổi vai ngay':'Gửi yêu cầu'}</button><button class="sec" onclick="closeM()">Hủy</button></div>
  </div></div>`;
}
async function submitSwap(){
  const f=S.swf;
  if(!f.to)return $('#swe').textContent='Hãy chọn người nhận';
  if(f.kind==='HD'&&!f.dayTo)return $('#swe').textContent='Hãy chọn ca của người nhận';
  const r=await rpc('swap_create',{...auth(),p_kind:f.kind,p_day:f.day,p_to:f.to,p_day_to:f.kind==='HD'?f.dayTo:null,p_reason:f.reason.trim()});
  if(!r.ok)return $('#swe').textContent=r.msg;
  const p=S.people.find(x=>x.code===f.to),me=S.data.label;
  S.lastMsg=f.kind==='DV'?`[Đổi vai ${fmt(f.day)}] ${me} chuyển sang trực chiến, ${p.label} sang trực ban.`
    :f.kind==='NC'?`[Đổi trực] ${me} đề nghị ${p.label} nhận ca trực ${fmt(f.day)}. Vui lòng mở Bảng điều phối để trả lời.`
    :`[Đổi trực] ${me} đề nghị đổi ca ${fmt(f.day)} lấy ca ${fmt(f.dayTo)} của ${p.label}. Vui lòng mở Bảng điều phối để trả lời.`;
  S.phonesStale=1;
  $('#modal').innerHTML=`<div class="ov"><div class="card"><h2>${f.kind==='DV'?'Đã đổi vai':'Đã gửi yêu cầu'}</h2><p class="mut">${f.kind==='DV'?'Thay đổi có hiệu lực ngay.':'Người nhận sẽ thấy thông báo khi mở ứng dụng.'} Nên nhắn thêm qua Zalo cho chắc.</p><div class="act"><button style="flex:1" onclick="shareText(S.lastMsg)">Báo qua Zalo</button><button class="sec" onclick="closeM()">Đóng</button></div></div></div>`;
  load();
}

function viewStats(){
  S.view='stats';
  const iso=x=>new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10),t=new Date();
  if(!S.stf)S.stf={from:iso(new Date(t.getFullYear(),t.getMonth(),1)),to:iso(t)};
  app.innerHTML=renderHeader()+renderNav()+`<div class="card"><h2>Thống kê</h2><p class="mut">Tải bảng từng ca trực: giờ khai báo đầu tiên, giờ cập nhật cuối, số lần đổi trạng thái. Giờ chỉ có từ ngày chạy SQL ghi nhận; các ngày trước đó để trống.</p>
    <label class="mut">Từ ngày</label><input type="date" value="${S.stf.from}" onchange="S.stf.from=this.value">
    <label class="mut" style="margin-top:8px;display:block">Đến ngày</label><input type="date" value="${S.stf.to}" onchange="S.stf.to=this.value">
    <p class="err" id="sfe"></p><button style="width:100%" onclick="exportStats()">Tải bảng CSV</button></div>`;
}
async function exportStats(){
  const r=await rpc('stats_range',{...auth(),p_from:S.stf.from,p_to:S.stf.to});
  if(!r.ok)return $('#sfe').textContent=r.msg;
  if(!r.rows.length)return $('#sfe').textContent='Không có ca trực nào trong khoảng này';
  const tm=a=>a?new Date(a).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const L=[['Ngày','Mã','Họ tên','Nhiệm vụ','Trạng thái cuối','Địa bàn','Khai báo đầu tiên','Người khai đầu','Cập nhật cuối','Số lần đổi','Người sửa cuối']]
    .concat(r.rows.map(x=>[fmt(x.day),x.code,x.label,DUTY[x.duty]||x.duty,x.st||NU,x.area,tm(x.first_at),x.first_by,tm(x.last_at),x.n,x.last_by]));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+L.map(l=>l.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='thong-ke-'+S.stf.from+'-'+S.stf.to+'.csv';document.body.appendChild(a);a.click();a.remove();
}

function areaField(cur){
  cur=cur||'';const L=S.areas;
  if(!L.length)return `<label class="mut" style="margin-top:10px;display:block">Địa bàn / ghi chú</label><input id="ea" maxlength="60" value="${esc(cur)}">`;
  const inList=!cur||L.includes(cur);
  return `<label class="mut" style="margin-top:10px;display:block">Địa bàn</label>
  <select id="eas" onchange="$('#ea').style.display=this.value==='__o'?'block':'none'">
    <option value="">(Không chọn)</option>
    ${L.map(a=>`<option ${a===cur?'selected':''}>${esc(a)}</option>`).join('')}
    <option value="__o" ${inList?'':'selected'}>Khác (nhập tay)</option>
  </select>
  <input id="ea" maxlength="60" placeholder="Nhập địa bàn khác" value="${inList?'':esc(cur)}" style="display:${inList?'none':'block'};margin-top:6px">`;
}

function areaVal(){const s=$('#eas');if(!s)return $('#ea').value.trim();return s.value==='__o'?$('#ea').value.trim():s.value}

async function saveSt(code){
  const st=$('#es').value,r=await rpc('set_status',{...auth(),p_target:code,p_st:st,p_area:areaVal()});
  if(!r.ok){$('#em').textContent=r.msg;return}
  closeM();toast('Đã lưu trạng thái');await load();
  if(code===S.data.code&&PROOF.includes(st))proof();
}

async function quickSet(s){
  const d=S.data,me=d.rows.find(r=>r.code===d.code);
  const r=await rpc('set_status',{...auth(),p_target:d.code,p_st:s,p_area:(me&&me.area)||''});
  if(!r.ok)return toast(r.msg);
  toast('Đã cập nhật: '+s);await load();
  if(PROOF.includes(s))proof();
}

function proof(){
  const d=S.data,me=d.rows.find(r=>r.code===d.code);if(!me)return;
  const tb=d.rows.filter(r=>r.duty==='TB'&&r.code!==d.code).map(r=>r.label).join(', ')||'trực ban';
  const msg=`[Báo trực ${fmt(d.day)}] ${me.label} (${me.code}): ${me.st}${me.area?' - '+me.area:''}. Gửi ${tb}, minh chứng đính kèm.`;
  $('#modal').innerHTML=`<div class="ov"><div class="card">
    <h2>Gửi minh chứng Zalo</h2>
    <p class="mut">Bạn đang <b>${esc(me.st)}</b>. Vui lòng gửi ảnh minh chứng cho: <b>${esc(tb)}</b>.</p>
    <label class="mut">Ảnh đính kèm</label>
    <input id="pf" type="file" accept="image/*" multiple>
    <label class="mut" style="margin-top:10px;display:block">Nội dung</label>
    <textarea id="pm" rows="3">${esc(msg)}</textarea>
    <div class="act" style="margin-top:14px">
      <button style="flex:1" onclick="sendZalo()">Mở Zalo gửi</button>
      <button class="sec" onclick="closeM()">Đóng</button>
    </div>
  </div></div>`;
}

async function sendZalo(){
  const msg=$('#pm').value,files=[...$('#pf').files],data={text:msg};
  if(files.length&&navigator.canShare&&navigator.canShare({files}))data.files=files;
  if(navigator.share){try{await navigator.share(data);closeM();return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(msg);toast('Đã chép nội dung. Mở Zalo dán đính kèm.')}catch(e){toast('Hãy tự chép nội dung vào Zalo')}
  window.open('https://zalo.me','_blank');
}

async function nudge(){
  const d=S.data,rows=d.rows,nu=rows.filter(r=>r.st===NU),cnt={};
  rows.forEach(r=>{if(r.st!==NU)cnt[r.st]=(cnt[r.st]||0)+1});
  const sum=Object.keys(cnt).map(k=>k+' '+cnt[k]).join(', ')||'chưa có ai khai báo';
  let msg=`[Quân số trực ${fmt(d.day)}] Ca trực ${rows.length} người, đã khai báo ${rows.length-nu.length}/${rows.length}.\nTình hình: ${sum}.`;
  if(nu.length)msg+=`\nChưa khai báo (${nu.length}): ${nu.map(r=>r.label+' ('+r.code+')').join(', ')}.\nĐề nghị các đồng chí cập nhật trạng thái trên Bảng điều phối.`;
  if(navigator.share){try{await navigator.share({text:msg});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(msg);toast('Đã chép tin nhắc, dán vào nhóm Zalo')}catch(e){toast('Hãy chép tin nhắc vào nhóm')}
}

async function viewOverview(day){
  S.view='ov';
  const r=await rpc('tr_overview',{...auth(),p_day:day||S.ovDay||null});
  if(!r.ok){toast(r.msg);S.view='board';return}
  S.ovDay=r.day;
  const shift=n=>{const t=new Date(r.day+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
  
  let h = renderHeader() + renderNav();
  h += `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <button class="sec sm" onclick="viewOverview('${shift(-1)}')">◀ Trước</button>
      <b style="font-size:1rem">${fmt(r.day)}</b>
      <button class="sec sm" onclick="viewOverview('${shift(1)}')">Sau ▶</button>
    </div>
    <input type="date" value="${esc(r.day)}" onchange="this.value&&viewOverview(this.value)">
  </div>`;

  if(!r.rows.length){
    h += `<div class="card"><p class="mut">Ngày này chưa có lịch trực.</p></div>`;
  } else {
    const done = r.rows.filter(x=>x.st).length;
    h += `<div class="card"><b>Danh sách có ca (${r.rows.length})</b> · Khai báo ${done}/${r.rows.length}</div>`;
    h += r.rows.map(x=>`
      <div class="item">
        <div class="av" style="background:${col(x.st||NU)}">${esc(ini(x.label))}</div>
        <div class="mid">
          <b>${esc(x.label)}</b>
          <div class="meta"><span class="dt">${DUTY[x.duty]||''}</span><span class="mut">${esc(x.code)}</span></div>
        </div>
        <div class="st-badge" style="background:${col(x.st||NU)}15;color:${col(x.st||NU)}">${icon(x.st||NU)} ${esc(x.st||NU)}</div>
      </div>
    `).join('');
  }
  app.innerHTML = h;
}

async function saveAreas(){
  const names=$('#ar').value.split('\n').map(x=>x.trim()).filter(Boolean);

  if(!r.ok)return toast(r.msg);

async function savePhones(){
  const rows=[];let bad='';
  $('#phn').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const p=l.split(/[,;\t]/).map(x=>x.trim());
    const code=(p[0]||'').toUpperCase(),phone=(p[1]||'').replace(/[\s.\-]/g,'');
    if(!code||(phone&&!/^0\d{9,10}$/.test(phone)))bad=bad||'Dòng sai: '+l;
    else rows.push({code,phone});
  });
  if(bad)return $('#phe').textContent=bad;
  if(!rows.length)return $('#phe').textContent='Chưa có dòng hợp lệ';
  const r=await rpc('admin_set_phones',{...auth(),p_rows:rows});
  if(!r.ok)return $('#phe').textContent=r.msg;
  $('#phe').textContent=r.miss&&r.miss.length?'Không có mã: '+r.miss.join(', '):'';
  toast('Đã lưu '+r.n+' số điện thoại');$('#phn').value='';viewAdmin();
}

async function doImport(){
  const rows=[];let bad='';
  $('#im').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
    const p=l.split(/[,;\t]/).map(x=>x.trim());
    if(i===0&&!/^\d{4}-\d{2}-\d{2}$/.test(p[0]))return;
    if(p.length===4)p.splice(1,1);
    const day=p[0],code=(p[1]||'').toUpperCase(),duty=(p[2]||'').toUpperCase();
    if(p.length!==3||!/^\d{4}-\d{2}-\d{2}$/.test(day)||!code||!['CH','TB','TC'].includes(duty))bad=bad||'Dòng sai: '+l;
    else rows.push({day,team:TEAM0,code,duty});
  });
  if(bad)return $('#ie').textContent=bad;
  if(!rows.length)return $('#ie').textContent='Chưa có dòng hợp lệ';
  const r=await rpc('admin_import',{...auth(),p_rows:rows});
  if(!r.ok)return $('#ie').textContent=r.msg;
  $('#ie').textContent='';toast('Đã nhập '+r.n+' dòng lịch');$('#im').value='';
}

// ===== Toàn cơ quan, người ngoài ca, lịch 100% quân số =====
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
const offHrs=()=>!!(S.off&&S.off.in_hours);
function offAlert(){
  if(!S.off||!S.off.all||!offHrs())return '';
  const n=S.off.rows.filter(r=>!r.on_duty&&!r.st).length;
  return n?`<div class="alert"><span>Toàn cơ quan: ${n} người ngoài ca chưa khai báo.</span><button class="sm pill" onclick="go('org')">Xem</button></div>`:'';
}
function offSelf(){
  const d=S.data,m=S.off&&S.off.rows.find(r=>r.code===d.code&&!r.on_duty);
  if(!m||d.rows.some(r=>r.code===d.code))return '';
  return `<div class="card"><h2>Hôm nay bạn không có ca trực</h2>
    <p class="mut" style="margin:-6px 0 10px">Cập nhật bạn đang làm gì. Không cần gửi minh chứng.</p>
    <div class="qg">${ST.map(s=>`<button class="q ${m.st===s?'on':''}" onclick="orgQuick('${s}')"><span style="color:${col(s)}">${icon(s)}</span>${s}</button>`).join('')}</div>
    <div class="mut" style="margin-top:12px;text-align:center">Địa bàn hiện tại: <b>${m.area?esc(m.area):'Chưa chọn'}</b> · <a href="#" onclick="editOrg('${esc(m.code)}');return false">Đổi địa bàn</a></div></div>`;
}
function orgItem(r){
  const d=S.data,counted=r.on_duty||offHrs(),st=r.st||NU,tel=r.code!==d.code?(S.phones[r.code]||''):'',can=r.code===d.code||d.role==='tb';
  return `<div class="item ${!r.st&&counted?'nu':''}" data-s="${esc(norm(r.label+' '+r.code))}">
    <div class="av" style="background:${col(st)}">${esc(ini(r.label))}</div>
    <div class="mid"><b>${esc(r.label)} ${r.code===d.code?'<span class="me">Bạn</span>':''}</b>
      <div class="meta"><span class="dt">${r.on_duty?(DUTY[r.duty]||''):'Không trực'}</span><span class="mut">${esc(r.code)}</span></div>
      ${r.area?`<div class="area">📍 ${esc(r.area)}</div>`:''}</div>
    <div style="text-align:right">
      <div class="st-badge" style="background:${col(st)}15;color:${col(st)}">${icon(st)} ${esc(st)}</div>
      <div class="mut" style="font-size:.7rem;margin-top:2px">${when(r.at)}</div>
      <div class="rowb">${tel?`<a class="call" href="tel:${esc(tel)}" aria-label="Gọi ${esc(r.label)}">${PHONE}</a><a class="call zl" href="https://zalo.me/${esc(tel)}" target="_blank" rel="noopener" aria-label="Zalo ${esc(r.label)}">Z</a>`:''}${can?`<button class="sm pill sec" onclick="${r.on_duty?'edit':'editOrg'}('${esc(r.code)}')">Cập nhật</button>`:''}</div>
    </div></div>`;
}
function viewOrg(){
  S.view='org';
  const o=S.off;let h=renderHeader()+renderNav();
  if(!o||!o.all){app.innerHTML=h+`<div class="card"><p class="mut">Bạn chưa xem được toàn cơ quan. Nếu vừa được phân công trực ban hôm nay, hãy bấm Làm mới. Nếu chưa thấy, có thể chưa chạy SQL đợt 1 trên Supabase.</p></div>`;return}
  const hrs=o.in_hours,rows=o.rows,counted=rows.filter(r=>r.on_duty||hrs),need=counted.filter(r=>!r.st);
  h+=`<div class="card"><h2>Toàn cơ quan: ${fmt(o.day)}</h2>
    <div style="font-size:1.6rem;font-weight:800">${counted.length-need.length}/${counted.length} <span class="mut">đã khai báo</span></div>
    <p class="mut" style="margin:6px 0 0">${hrs?'Đang trong giờ hành chính.':'Ngoài giờ hành chính (07:00 đến 11:30, 13:30 đến 17:00, thứ 2 đến thứ 6): người không trực chưa bị tính là chưa khai báo.'}</p></div>`;
  if(need.length)h+=`<div class="alert"><span>${need.length} người chưa khai báo.</span><button class="sm pill" onclick="offNudge()">Nhắc qua Zalo</button></div>`;
  h+=`<input type="search" id="q" placeholder="Tìm theo tên hoặc mã" value="${esc(S.q)}" oninput="setQ(this.value)" style="margin:0 0 8px">`;
  const G={'Chưa khai báo':[],'Đang có ca trực':[],'Không trực hôm nay':[]};
  rows.forEach(r=>G[need.includes(r)?'Chưa khai báo':r.on_duty?'Đang có ca trực':'Không trực hôm nay'].push(r));
  h+=Object.keys(G).filter(k=>G[k].length).map(k=>`<div class="gh"><span>${k}</span><span>${G[k].length} người</span></div>${G[k].map(orgItem).join('')}`).join('')||`<div class="card"><p class="mut">Chưa có cán bộ nào.</p></div>`;
  app.innerHTML=h;if(S.q)applyQ();
}
function offNudge(){
  const o=S.off,n=o.rows.filter(r=>!r.st&&(r.on_duty||o.in_hours));
  shareText(`[Nhắc ${fmt(o.day)}] Các đồng chí chưa cập nhật trạng thái: ${n.map(r=>r.label+' ('+r.code+')').join(', ')}. Vui lòng cập nhật trên Bảng điều phối.`,'Đã chép lời nhắc, dán vào Zalo');
}
function editOrg(code){
  const r=S.off.rows.find(x=>x.code===code);
  $('#modal').innerHTML=`<div class="ov"><div class="card">
    <h2>${esc(r.label)}</h2><p class="mut">Không có ca trực hôm nay.</p>
    <label class="mut">Trạng thái</label>
    <select id="es">${ST.map(s=>`<option ${s===r.st?'selected':''}>${s}</option>`).join('')}</select>
    ${areaField(r.area)}
    <p class="err" id="em"></p>
    <div class="act" style="margin-top:14px"><button style="flex:1" onclick="saveOrg('${esc(code)}')">Lưu trạng thái</button><button class="sec" onclick="closeM()">Hủy</button></div>
  </div></div>`;
}
async function saveOrg(code){
  const r=await rpc('office_set',{...auth(),p_target:code,p_st:$('#es').value,p_area:areaVal()});
  if(!r.ok){$('#em').textContent=r.msg;return}
  closeM();toast('Đã lưu trạng thái');load();
}
async function orgQuick(s){
  const m=S.off&&S.off.rows.find(r=>r.code===S.data.code);
  const r=await rpc('office_set',{...auth(),p_target:S.data.code,p_st:s,p_area:(m&&m.area)||''});
  if(!r.ok)return toast(r.msg);
  toast('Đã cập nhật: '+s);load();
}

function fpRender(){
  const el=$('#fp_tab');if(!el)return;
  if(!S.fp||!S.fp.length){el.innerHTML='';return}
  const opt=v=>'<option value="">(Chọn)</option>'+S.cands.map(o=>`<option value="${esc(o.code)}" ${o.code===v?'selected':''}>${esc(o.label)} (${esc(o.code)})</option>`).join('');
  el.innerHTML=S.fp.map((x,i)=>`<div style="padding:8px 0;border-top:1px solid var(--border);margin-top:8px">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>${DOW[new Date(x.day+'T00:00:00Z').getUTCDay()]} ${fmt(x.day)}</b>${i?`<button class="sm pill sec" onclick="fpCopy(${i})">Giống ngày trước</button>`:''}</div>
    <select onchange="S.fp[${i}].a=this.value">${opt(x.a)}</select><select onchange="S.fp[${i}].b=this.value">${opt(x.b)}</select></div>`).join('');
}
function fpBuild(){
  const f=$('#fp_from').value,t=$('#fp_to').value,e=$('#fpe'),min=S.data.day;
  if(!f||!t)return e.textContent='Hãy chọn từ ngày và đến ngày';
  if(t<f)return e.textContent='Ngày kết thúc phải sau ngày bắt đầu';
  if(f<min)return e.textContent='Không tạo lịch cho ngày đã qua (từ '+fmt(min)+' trở đi)';
  const L=[],end=new Date(t+'T00:00:00Z');let c=new Date(f+'T00:00:00Z');
  while(c<=end&&L.length<62){const day=c.toISOString().slice(0,10);L.push((S.fp||[]).find(x=>x.day===day)||{day,a:'',b:''});c.setUTCDate(c.getUTCDate()+1)}
  e.textContent=c<=end?'Chỉ tạo tối đa 62 ngày mỗi lần, đã lấy 62 ngày đầu':'';
  S.fp=L;fpRender();
}
function fpCopy(i){S.fp[i].a=S.fp[i-1].a;S.fp[i].b=S.fp[i-1].b;fpRender()}
function fpPaste(){
  const e=$('#fpe'),L=S.fp||[],ok=c=>S.cands.some(o=>o.code===c);let bad='';
  $('#fp_paste').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const p=l.split(/[,;\t]/).map(x=>x.trim()),a=(p[1]||'').toUpperCase(),b=(p[2]||'').toUpperCase();
    if(p.length!==3||!/^\d{4}-\d{2}-\d{2}$/.test(p[0])||!ok(a)||!ok(b)){bad=bad||'Dòng sai hoặc mã không trực ban được: '+l;return}
    let x=L.find(y=>y.day===p[0]);if(!x){x={day:p[0]};L.push(x)}
    x.a=a;x.b=b;
  });
  L.sort((a,b)=>a.day<b.day?-1:1);S.fp=L;e.textContent=bad;fpRender();
}
async function fpSave(){
  const e=$('#fpe'),L=S.fp||[];
  if(!L.length)return e.textContent='Hãy bấm Tạo bảng trước';
  const x=L.find(y=>!y.a||!y.b||y.a===y.b);
  if(x)return e.textContent='Ngày '+fmt(x.day)+': hãy chọn đủ 2 người trực ban khác nhau';
  if(!confirm('Lưu lịch '+L.length+' ngày? Lịch cũ của các ngày này sẽ bị thay mới.'))return;
  const r=await rpc('admin_import_full',{...auth(),p_days:L.map(y=>({day:y.day,tb:[y.a,y.b]}))});
  if(!r.ok)return e.textContent=r.msg;
  S.fp=[];fpRender();e.textContent='';S.phonesStale=1;toast('Đã lưu '+r.days+' ngày, '+r.rows+' dòng lịch');
}

// ===== Tổ, tổ trưởng, tổ phó =====
const RLT={TT:'Tổ trưởng',TP:'Tổ phó',TV:'Thành viên'};
function teamItem(m,tm){
  const d=S.data,t=S.team,counted=m.on_duty||t.in_hours,st=m.st||NU,tel=m.code!==d.code?(S.phones[m.code]||''):'';
  return `<div class="item ${!m.st&&counted?'nu':''}" data-s="${esc(norm(m.label+' '+m.code))}">
    <div class="av" style="background:${col(st)}">${esc(ini(m.label))}</div>
    <div class="mid"><b>${esc(m.label)} ${m.code===d.code?'<span class="me">Bạn</span>':''}</b>
      <div class="meta"><span class="dt">${RLT[m.role]}</span>${m.on_duty?`<span class="dt">${DUTY[m.duty]||''}</span>`:''}<span class="mut">${esc(m.code)}</span></div>
      ${m.area?`<div class="area">📍 ${esc(m.area)}</div>`:''}</div>
    <div style="text-align:right">
      <div class="st-badge" style="background:${col(st)}15;color:${col(st)}">${icon(st)} ${esc(st)}</div>
      <div class="mut" style="font-size:.7rem;margin-top:2px">${when(m.at)}</div>
      <div class="rowb">${tel?`<a class="call" href="tel:${esc(tel)}" aria-label="Gọi ${esc(m.label)}">${PHONE}</a><a class="call zl" href="https://zalo.me/${esc(tel)}" target="_blank" rel="noopener" aria-label="Zalo ${esc(m.label)}">Z</a>`:''}${tm.can_manage?`<button class="sm pill sec" onclick="editTeam('${esc(m.code)}')">Cập nhật</button>`:''}</div>
    </div></div>`;
}
function viewTeam(){
  S.view='team';
  const t=S.team;let h=renderHeader()+renderNav();
  if(!t){app.innerHTML=h+`<div class="card"><p class="mut">Bạn chưa thuộc tổ nào. Nếu vừa được xếp tổ, hãy bấm Làm mới. Nếu chưa thấy, có thể chưa chạy SQL đợt 2 trên Supabase.</p></div>`;return}
  h+=`<input type="search" id="q" placeholder="Tìm theo tên hoặc mã" value="${esc(S.q)}" oninput="setQ(this.value)" style="margin:0 0 8px">`;
  h+=t.teams.map(tm=>{
    const cnt=tm.members.filter(m=>m.on_duty||t.in_hours),done=cnt.filter(m=>m.st).length;
    let s=`<div class="gh"><span>${esc(tm.name)}${tm.mine?' (tổ của bạn)':''}</span><span>${cnt.length?done+'/'+cnt.length+' đã khai':tm.members.length+' người'}</span></div>`;
    const info=tm.deleg.map(g=>`<div class="mut">Quyền tổ trưởng đang giao cho <b>${esc(g.label)}</b> đến hết ${fmt(g.until)}${tm.can_delegate?` · <a href="#" onclick="revokeDeleg(${tm.id},'${esc(g.code)}');return false">Thu hồi</a>`:''}</div>`).join('')
      +(tm.can_delegate&&tm.members.some(m=>m.role==='TP')?`<div style="margin-top:6px"><button class="sm pill sec" onclick="openDelegate(${tm.id})">Giao quyền cho tổ phó</button></div>`:'');
    if(info)s+=`<div class="card" style="padding:12px 14px;margin-bottom:8px">${info}</div>`;
    return s+tm.members.map(m=>teamItem(m,tm)).join('');
  }).join('');
  app.innerHTML=h;if(S.q)applyQ();
}
function editTeam(code){
  let m=null;S.team.teams.forEach(t=>t.members.forEach(x=>{if(x.code===code)m=x}));
  if(!m)return;
  $('#modal').innerHTML=`<div class="ov"><div class="card">
    <h2>${esc(m.label)}</h2><p class="mut">${m.on_duty?'Đang có ca trực hôm nay.':'Không có ca trực hôm nay.'} Bạn đang nhập thay.</p>
    <label class="mut">Trạng thái</label>
    <select id="es">${(m.on_duty?STE:ST).map(s=>`<option ${s===m.st?'selected':''}>${s}</option>`).join('')}</select>
    ${areaField(m.area)}
    <p class="err" id="em"></p>
    <div class="act" style="margin-top:14px"><button style="flex:1" onclick="saveTeam('${esc(code)}')">Lưu trạng thái</button><button class="sec" onclick="closeM()">Hủy</button></div>
  </div></div>`;
}
async function saveTeam(code){
  const r=await rpc('team_set',{...auth(),p_target:code,p_st:$('#es').value,p_area:areaVal()});
  if(!r.ok){$('#em').textContent=r.msg;return}
  closeM();toast('Đã lưu trạng thái');load();
}
function openDelegate(id){
  const tm=S.team.teams.find(x=>x.id===id),t0=new Date(S.team.today+'T00:00:00Z');t0.setUTCDate(t0.getUTCDate()+7);
  $('#modal').innerHTML=`<div class="ov"><div class="card">
    <h2>Giao quyền tổ trưởng</h2><p class="mut">Tổ ${esc(tm.name)}. Tổ phó được giao sẽ xem và nhập thay cho cả tổ. Hết ngày kết thúc, quyền tự về lại tổ trưởng.</p>
    <label class="mut">Giao cho</label>
    <select id="dg_who">${tm.members.filter(m=>m.role==='TP').map(m=>`<option value="${esc(m.code)}">${esc(m.label)} (${esc(m.code)})</option>`).join('')}</select>
    <label class="mut" style="margin-top:10px;display:block">Đến hết ngày</label>
    <input type="date" id="dg_to" min="${esc(S.team.today)}" value="${t0.toISOString().slice(0,10)}">
    <p class="err" id="dge"></p>
    <div class="act" style="margin-top:14px"><button style="flex:1" onclick="submitDelegate(${id})">Giao quyền</button><button class="sec" onclick="closeM()">Hủy</button></div>
  </div></div>`;
}
async function submitDelegate(id){
  const to=$('#dg_to').value;
  if(!to)return $('#dge').textContent='Hãy chọn ngày kết thúc';
  const r=await rpc('team_delegate',{...auth(),p_team:id,p_deputy:$('#dg_who').value,p_until:to});
  if(!r.ok)return $('#dge').textContent=r.msg;
  closeM();toast('Đã giao quyền');load();
}
async function revokeDeleg(id,code){
  if(!confirm('Thu hồi quyền đã giao cho '+code+'?'))return;
  const r=await rpc('team_revoke',{...auth(),p_team:id,p_deputy:code});
  if(!r.ok)return toast(r.msg);
  toast('Đã thu hồi');load();
}

function teamAdmin(os){
  const T=(S.team&&S.team.teams)||[],inT=new Set();
  T.forEach(t=>t.members.forEach(m=>inT.add(m.code)));
  const un=os.filter(o=>o.active&&o.kind==='CB'&&!inT.has(o.code));
  return (T.length?T.map(t=>`<div style="padding:8px 0;border-top:1px solid var(--border)"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(t.name)} <span class="mut">(${t.members.length})</span></b><button class="sm pill sec" onclick="renameTeam(${t.id})">Đổi tên</button></div><div class="mut" style="font-size:.78rem">${t.members.map(m=>esc(m.code)+(m.role==='TV'?'':' ('+m.role+')')).join(', ')}</div></div>`).join(''):'<p class="mut">Chưa có tổ nào.</p>')
    +(un.length?`<p class="mut" style="margin-top:8px">Chưa xếp tổ (${un.length}): ${un.map(o=>esc(o.code)).join(', ')}</p>`:'');
}
async function saveTeams(){
  const rows=[];let bad='';
  $('#tm_in').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const p=l.split(/[,;\t]/).map(x=>x.trim()),code=(p[0]||'').toUpperCase();
    if(p.length===2&&code&&norm(p[1])==='go')rows.push({code,team:'',role:''});
    else if(p.length===3&&code&&p[1]&&p[1].length<=30&&/^(TT|TP|TV)$/i.test(p[2]))rows.push({code,team:p[1],role:p[2].toUpperCase()});
    else bad=bad||'Dòng sai: '+l;
  });
  if(bad)return $('#tme').textContent=bad;
  if(!rows.length)return $('#tme').textContent='Chưa có dòng hợp lệ';
  const r=await rpc('admin_set_teams',{...auth(),p_rows:rows});
  if(!r.ok)return $('#tme').textContent=r.msg;
  toast('Đã lưu '+r.n+' dòng');viewAdmin();
}
async function renameTeam(id){
  const t=S.team.teams.find(x=>x.id===id),n=prompt('Tên mới của tổ (tối đa 30 ký tự, không dùng dấu phẩy):',t.name);
  if(n===null)return;
  const r=await rpc('admin_rename_team',{...auth(),p_id:id,p_name:n.trim()});
  if(!r.ok)return toast(r.msg);
  toast('Đã đổi tên tổ');viewAdmin();
}

viewLogin();
</script></body></html>
