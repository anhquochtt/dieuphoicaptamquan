<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng điều phối quân số</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#eaf3ff;--fg:#14233b;--mut:#5b6b82;--card:#fff;--bd:#d3e2f6;--p1:#1769e0;--p2:#10b3a3;--btn:#1769e0;--sunb:#ffe28a;--sun:#5a4300;--tbb:#d9e8ff;--tb:#0f4fb8;--okb:#d6f5e2;--ok:#0b7a3c;--wab:#ffe9bf;--wa:#8a4b00;--badb:#ffdada;--bad:#b3202a;--grb:#e4ecf8;--gr:#43536b;--sh:0 4px 14px rgba(23,105,224,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1526;--fg:#e8eefb;--mut:#9fb0c9;--card:#17223a;--bd:#2a3a5a;--p1:#2f78e6;--p2:#12a89a;--btn:#2f78e6;--sunb:#4a3a08;--sun:#ffd95a;--tbb:#1c3560;--tb:#9cc4ff;--okb:#123a28;--ok:#7be0a8;--wab:#3d2e0c;--wa:#f5c86a;--badb:#431b1f;--bad:#ff9fa5;--grb:#243252;--gr:#b7c4da;--sh:0 4px 14px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 "Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:1.45rem;margin:0 0 4px;font-weight:800}h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.narrow{max-width:400px;margin:5vh auto 0}
.login{padding:0;overflow:hidden}.login .in{padding:6px 16px 16px}
.hero{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;text-align:center;padding:26px 16px 22px}
.hero .logo{font-size:3rem;line-height:1;margin-bottom:6px}.hero h1{color:#fff}.hero p{margin:0;opacity:.92;font-size:.92rem}
.mut{color:var(--mut);font-size:.88rem}
.err{color:var(--bad);min-height:1.2em;margin:6px 0;font-weight:600}
label{display:block;margin:10px 0;font-size:.92rem;font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px;font:inherit;font-weight:400;color:var(--fg);background:var(--bg);border:2px solid var(--bd);border-radius:12px}
input[type=checkbox]{display:inline-block;width:auto;margin-right:6px}
button{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:999px;background:linear-gradient(120deg,var(--p1),var(--p2));color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(23,105,224,.25)}
button:active{transform:scale(.97)}
button.sec{background:var(--card);color:var(--btn);border:2px solid var(--bd);box-shadow:none}
button.sm{padding:6px 14px;font-size:.85rem}
button.gl{background:rgba(255,255,255,.22);box-shadow:none;padding:7px 13px;font-size:.85rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sunb);outline-offset:1px;border-color:var(--p1)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:14px;border-radius:18px;color:#fff;background:linear-gradient(120deg,var(--p1),var(--p2));box-shadow:var(--sh)}
.who{display:flex;gap:10px;align-items:center}.who .sub,.day{font-size:.85rem;opacity:.92}.day{text-align:right}
.act{display:flex;gap:6px;flex-wrap:wrap}
.av{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:#fff;background:#6b7a90;border:2px solid rgba(255,255,255,.7)}
.tA{background:#1769e0}.tB{background:#0fa37f}.tC{background:#f08a00}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tile{flex:1 1 92px;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);font-size:.85rem;font-weight:600}
.tile .num{font-size:1.8rem;font-weight:800;line-height:1.1}
.tile.big{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:0}
.tile.s-ok{background:var(--okb);color:var(--ok);border:0}.tile.s-wa{background:var(--wab);color:var(--wa);border:0}.tile.s-bad{background:var(--badb);color:var(--bad);border:0}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:6px solid #8a98ad;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.item.s-ok{border-left-color:#14a44d}.item.s-wa{border-left-color:#f59e0b}.item.s-bad{border-left-color:#e5484d}
.mid{flex:1;min-width:0}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.area{margin-top:4px;font-size:.9rem;font-weight:600;color:var(--p1)}
.me{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunb);color:var(--sun)}
.dt{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--grb);color:var(--gr)}
.dCH{background:var(--sunb);color:var(--sun)}.dTB{background:var(--tbb);color:var(--tb)}
.r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.st{font-size:.85rem;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--grb);color:var(--gr)}
.st.ok{background:var(--okb);color:var(--ok)}.st.wa{background:var(--wab);color:var(--wa)}.st.bad{background:var(--badb);color:var(--bad)}
nav{display:flex;gap:8px;margin-bottom:12px}
nav button{flex:1}nav button.on{box-shadow:0 3px 10px rgba(23,105,224,.35)}
.ov{position:fixed;inset:0;background:rgba(10,20,40,.6);display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow:auto;z-index:5}
.ov .card{width:100%;max-width:420px;margin-top:8vh}
.pin{font-size:2.4rem;letter-spacing:.3em;text-align:center;font-weight:800;margin:10px 0;color:var(--p1)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#14233b;color:#fff;padding:10px 16px;border-radius:999px;display:none;z-index:9;max-width:90%;font-weight:600}
code{background:var(--grb);padding:1px 6px;border-radius:6px}
</style></head><body>
<main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
const API='https://ihrihhpovslcywzjtjtx.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_a_pTZDIgAbLO4F2_usPJUw_d0dEgNSn';
const ST=['Sẵn sàng','Trực ban','Tuần tra','Tiếp công dân','Giải quyết vụ việc','Công tác khác','Nghỉ phép/bù','Ốm','Học tập/công tác'];
const DUTY={CH:'Chỉ huy',TB:'Trực ban',TC:'Trực chiến'};
const ROLE={ad:'Quản trị',ch:'Chỉ huy',tb:'Trực ban',tc:'Trực chiến',off:'Không có ca trực hôm nay'};
let S={code:'',pin:'',me:null,data:null,view:'board',timer:null,areas:[],areasOk:false};
const $=s=>document.querySelector(s), app=$('#app');
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?d.split('-').reverse().join('/'):'';
const when=a=>a?new Date(a).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'';
const cls=s=>['Sẵn sàng','Trực ban'].includes(s)?'ok':['Tuần tra','Tiếp công dân','Giải quyết vụ việc','Công tác khác'].includes(s)?'wa':['Nghỉ phép/bù','Ốm','Học tập/công tác'].includes(s)?'bad':'';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function closeM(){$('#modal').innerHTML=''}
async function rpc(fn,a){
  try{const r=await fetch(API+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(a)});
    const j=await r.json();if(!r.ok)return{ok:false,msg:j.message||'Lỗi máy chủ'};return j}
  catch(e){return{ok:false,msg:'Không kết nối được mạng'}}
}
const auth=()=>({p_code:S.code,p_pin:S.pin});

/* ---- Đăng nhập ---- */
function viewLogin(msg){
  app.innerHTML=`<div class="card narrow login"><div class="hero"><div class="logo">🛡️</div><h1>Bảng điều phối quân số</h1><p>Cập nhật trạng thái trực nhanh, mọi người cùng thấy</p></div><div class="in">
  <label>Mã cán bộ<input id="c" autocapitalize="characters" autocomplete="username" placeholder="Ví dụ CB07" onkeydown="if(event.key==='Enter')$('#p').focus()"></label>
  <label>PIN 4 số<input id="p" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label>
  <p class="err">${esc(msg||'')}</p><button style="width:100%" onclick="doLogin()">Đăng nhập</button></div></div>`;
}
async function doLogin(){
  const c=$('#c').value.trim().toUpperCase(),p=$('#p').value;
  const r=await rpc('login',{p_code:c,p_pin:p});
  if(!r.ok)return viewLogin(r.msg);
  S.code=c;S.pin=p;S.me=r;r.must_change?viewChange():load();
}
function logout(){clearInterval(S.timer);S={code:'',pin:'',me:null,data:null,view:'board',timer:null,areas:[],areasOk:false};closeM();viewLogin()}

/* ---- Đổi PIN ---- */
function viewChange(msg){
  const first=S.me&&S.me.must_change;
  app.innerHTML=`<div class="card narrow"><h1>${first?'Đổi PIN lần đầu':'Đổi PIN'}</h1><p class="mut">PIN mới gồm 4 số, không dùng số lặp hoặc dễ đoán (0000, 1234).</p>
  <label>PIN mới<input id="n1" type="password" inputmode="numeric" maxlength="4"></label>
  <label>Nhập lại PIN mới<input id="n2" type="password" inputmode="numeric" maxlength="4" onkeydown="if(event.key==='Enter')doChange()"></label>
  <p class="err">${esc(msg||'')}</p><div class="act"><button onclick="doChange()">Lưu PIN</button>${first?'':'<button class="sec" onclick="viewBoard()">Hủy</button>'}</div></div>`;
}
async function doChange(){
  const a=$('#n1').value,b=$('#n2').value;
  if(a!==b)return viewChange('Hai lần nhập chưa khớp');
  const r=await rpc('change_pin',{...auth(),p_new:a});
  if(!r.ok)return viewChange(r.msg);
  S.pin=a;S.me.must_change=false;toast('Đã đổi PIN');load();
}

/* ---- Bảng điều phối ---- */
async function load(){
  const r=await rpc('board',auth());
  if(!r.ok){if(S.data)toast(r.msg);else viewLogin(r.msg);return}
  if(!S.areasOk){const a=await rpc('get_areas',auth());if(a.ok){S.areas=a.areas;S.areasOk=true}}
  S.data=r;if(S.view==='board')viewBoard();
  clearInterval(S.timer);S.timer=setInterval(()=>{if(S.view==='board'&&!$('#modal').innerHTML)load()},30000);
}
const ini=l=>((String(l||'?').trim().split(/\s+/).pop())||'?').charAt(0).toUpperCase();
const sc=c=>c?'s-'+c:'';
function head(){
  const d=S.data;
  return `<header class="top"><div class="who"><div class="av t${esc(d.team||'')}">${esc(ini(d.label))}</div><div><b>${esc(d.label)}</b><div class="sub">${esc(d.code)} · ${ROLE[d.role]}</div></div></div>
  <div class="day">Ngày trực<br><b>${fmt(d.day)}</b></div>
  <div class="act"><button class="gl" onclick="load()">Làm mới</button><button class="gl" onclick="viewChange()">Đổi PIN</button><button class="gl" onclick="logout()">Thoát</button></div></header>`+
  (d.role==='ad'?`<nav><button class="${S.view==='board'?'':'sec'}" onclick="S.view='board';viewBoard()">Bảng quân số</button><button class="${S.view==='admin'?'':'sec'}" onclick="viewAdmin()">Quản trị</button></nav>`:'');
}
function viewBoard(){
  S.view='board';const d=S.data,rows=d.rows,cnt={};
  rows.forEach(r=>cnt[r.st]=(cnt[r.st]||0)+1);
  let h=head();
  h+=`<div class="tiles"><div class="tile big"><span class="num">${rows.length}</span>Quân số trực</div>${Object.keys(cnt).map(k=>`<div class="tile ${sc(cls(k))}"><span class="num">${cnt[k]}</span>${esc(k)}</div>`).join('')}</div>`;
  if(d.next)h+=`<p class="mut">Ca trực tiếp theo của bạn: <b>${fmt(d.next)}</b></p>`;
  h+=rows.length?rows.map(r=>{
    const can=r.code===d.code||d.role==='tb',c=cls(r.st);
    return `<div class="item ${sc(c)}"><div class="av t${esc(r.team)}">${esc(ini(r.label))}</div>
    <div class="mid"><b>${esc(r.label)}</b>${r.code===d.code?' <span class="me">Bạn</span>':''}
    <div class="meta"><span class="dt d${esc(r.duty)}">${DUTY[r.duty]||''}</span><span class="mut">${esc(r.code)} · Ca ${esc(r.team)}</span></div>
    ${r.area?`<div class="area">📍 ${esc(r.area)}</div>`:''}</div>
    <div class="r"><span class="st ${c}">${esc(r.st)}</span><span class="mut">${when(r.at)}</span>${can?`<button class="sm" onclick="edit('${esc(r.code)}')">Cập nhật</button>`:''}</div></div>`}).join('')
    :`<div class="card"><p class="mut">Hôm nay chưa có lịch trực. Quản trị cần nhập lịch ở mục Quản trị.</p></div>`;
  if(d.log&&d.log.length)h+=`<div class="card"><h2>Hoạt động gần đây</h2>${d.log.map(l=>`<div class="row"><span>${esc(l.what)}</span><span class="mut">${when(l.at)}</span></div>`).join('')}</div>`;
  app.innerHTML=h;
}
function edit(code){
  const r=S.data.rows.find(x=>x.code===code);
  $('#modal').innerHTML=`<div class="ov"><div class="card"><h2>${esc(r.label)}</h2>
  <label>Trạng thái<select id="es">${ST.map(s=>`<option ${s===r.st?'selected':''}>${s}</option>`).join('')}</select></label>
  ${areaField(r.area)}
  <p class="err" id="em"></p><div class="act"><button onclick="saveSt('${esc(code)}')">Lưu trạng thái</button><button class="sec" onclick="closeM()">Hủy</button></div></div></div>`;
}
function areaField(cur){
  cur=cur||'';const L=S.areas;
  if(!L.length)return `<label>Địa bàn / ghi chú<input id="ea" maxlength="60" value="${esc(cur)}"></label>`;
  const inList=!cur||L.includes(cur);
  return `<label>Địa bàn<select id="eas" onchange="$('#ea').style.display=this.value==='__o'?'block':'none'"><option value="">(Không chọn)</option>${L.map(a=>`<option ${a===cur?'selected':''}>${esc(a)}</option>`).join('')}<option value="__o" ${inList?'':'selected'}>Khác (nhập tay)</option></select>
  <input id="ea" maxlength="60" placeholder="Nhập địa bàn khác" value="${inList?'':esc(cur)}" style="display:${inList?'none':'block'}"></label>`;
}
function areaVal(){const s=$('#eas');if(!s)return $('#ea').value.trim();return s.value==='__o'?$('#ea').value.trim():s.value}
async function saveSt(code){
  const r=await rpc('set_status',{...auth(),p_target:code,p_st:$('#es').value,p_area:areaVal()});
  if(!r.ok){$('#em').textContent=r.msg;return}
  closeM();toast('Đã lưu');load();
}

/* ---- Quản trị ---- */
async function viewAdmin(){
  S.view='admin';
  const r=await rpc('admin_list',auth());
  if(!r.ok){toast(r.msg);S.view='board';return}
  const ar=await rpc('get_areas',auth());if(ar.ok){S.areas=ar.areas;S.areasOk=true}
  const opt=(v,t)=>`<option value="${v}">${t}</option>`;
  app.innerHTML=head()+`<div class="card"><h2>Danh sách cán bộ (${r.officers.length})</h2>`+
  r.officers.map(o=>`<div class="row"><div><b>${esc(o.code)}</b> ${esc(o.label)}<div class="mut">${o.kind}${o.team?' · Ca '+o.team:''}${o.active?'':' · Đã ngừng'}${o.locked?' · ĐANG KHÓA':''}${o.must_change?' · Chưa đổi PIN':''}</div></div>
  <div class="act"><button class="sec" onclick='fillOff(${JSON.stringify(o).replace(/'/g,"&#39;")})'>Sửa</button><button class="sec" onclick="resetPin('${esc(o.code)}')">Đặt lại PIN</button></div></div>`).join('')+`</div>
  <div class="card"><h2>Thêm hoặc sửa cán bộ</h2>
  <label>Mã (ví dụ CB07)<input id="oc" autocapitalize="characters"></label>
  <label>Tên hiển thị<input id="ol"></label>
  <label>Loại<select id="ok">${opt('CB','CB: Cán bộ')+opt('CH','CH: Chỉ huy')+opt('QT','QT: Quản trị')}</select></label>
  <label>Ca mặc định<select id="ot">${opt('','Không có')+opt('A','Ca A')+opt('B','Ca B')+opt('C','Ca C')}</select></label>
  <label><input type="checkbox" id="oa" checked>Đang hoạt động</label>
  <p class="mut">Mã mới sẽ được cấp PIN tạm ngẫu nhiên, hiện một lần duy nhất.</p>
  <button onclick="saveOff()">Lưu cán bộ</button></div>
  <div class="card"><h2>Danh sách địa bàn</h2>
  <p class="mut">Mỗi dòng một địa bàn. Cán bộ sẽ chọn trong danh sách này khi cập nhật trạng thái. Lưu sẽ thay toàn bộ danh sách cũ.</p>
  <textarea id="ar" rows="6">${esc(S.areas.join('\n'))}</textarea>
  <p class="err" id="are"></p><button onclick="saveAreas()">Lưu danh sách địa bàn</button></div>
  <div class="card"><h2>Nhập lịch trực</h2>
  <p class="mut">Mỗi dòng một người: <code>ngày,ca,mã,nhiệm vụ</code>. Ví dụ <code>2026-11-14,A,CB06,TB</code>. Nhiệm vụ: CH (chỉ huy), TB (trực ban), TC (trực chiến). Ngày nào có trong dữ liệu sẽ được thay mới hoàn toàn.</p>
  <textarea id="im" rows="8" placeholder="2026-11-14,A,CB01,CH"></textarea>
  <p class="err" id="ie"></p><button onclick="doImport()">Nhập lịch</button></div>`;
}
function fillOff(o){$('#oc').value=o.code;$('#ol').value=o.label;$('#ok').value=o.kind;$('#ot').value=o.team||'';$('#oa').checked=o.active;$('#oc').scrollIntoView({behavior:'smooth'})}
function pinBox(title,code,pin){
  $('#modal').innerHTML=`<div class="ov"><div class="card"><h2>${esc(title)} ${esc(code)}</h2><div class="pin">${esc(pin)}</div><p class="mut">Ghi lại và gửi riêng cho cán bộ. PIN này chỉ hiện một lần, người dùng sẽ phải đổi ngay khi đăng nhập.</p><button onclick="closeM()">Đã ghi lại</button></div></div>`;
}
async function saveOff(){
  const code=$('#oc').value.trim().toUpperCase();
  if(!code||!$('#ol').value.trim())return toast('Cần nhập mã và tên');
  const r=await rpc('admin_save_officer',{...auth(),o_code:code,o_label:$('#ol').value.trim(),o_kind:$('#ok').value,o_team:$('#ot').value,o_active:$('#oa').checked});
  if(!r.ok)return toast(r.msg);
  if(r.pin)pinBox('PIN tạm của',code,r.pin);else toast('Đã lưu');
  viewAdmin();
}
async function resetPin(code){
  if(!confirm('Đặt lại PIN cho '+code+'?'))return;
  const r=await rpc('admin_reset_pin',{...auth(),o_code:code});
  if(!r.ok)return toast(r.msg);
  pinBox('PIN tạm mới của',code,r.pin);viewAdmin();
}
async function doImport(){
  const rows=[];let bad='';
  $('#im').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
    const p=l.split(/[,;\t]/).map(x=>x.trim());
    if(i===0&&!/^\d{4}-\d{2}-\d{2}$/.test(p[0]))return;
    if(p.length<4||!/^\d{4}-\d{2}-\d{2}$/.test(p[0])||!['A','B','C'].includes(p[1].toUpperCase())||!['CH','TB','TC'].includes(p[3].toUpperCase()))bad=bad||'Dòng sai: '+l;
    else rows.push({day:p[0],team:p[1],code:p[2],duty:p[3]});
  });
  if(bad)return $('#ie').textContent=bad;
  if(!rows.length)return $('#ie').textContent='Chưa có dòng nào';
  const r=await rpc('admin_import',{...auth(),p_rows:rows});
  if(!r.ok)return $('#ie').textContent=r.msg;
  $('#ie').textContent='';toast('Đã nhập '+r.n+' dòng lịch');$('#im').value='';
}
async function saveAreas(){
  const names=$('#ar').value.split('\n').map(x=>x.trim()).filter(Boolean);
