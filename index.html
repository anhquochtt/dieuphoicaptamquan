<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng điều phối quân số</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#f5f2ef;--fg:#101012;--mut:#6b6f76;--card:#fff;--bd:#e8e4e0;--or:#ff7a1a;--ink:#0d0d0f;--grb:#efecea;--sunb:#ffe3c2;--sun:#8a4300;--tbb:#e1e8ff;--tb:#2f46b5;--sh:0 2px 10px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#18181b;--fg:#f1f1f3;--mut:#a3a7af;--card:#242428;--bd:#34343a;--grb:#2e2e33;--sunb:#4a3010;--sun:#ffc27a;--tbb:#26325e;--tb:#a9bbff;--sh:0 2px 10px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 "Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:1.45rem;margin:0 0 4px;font-weight:800}h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.narrow{max-width:400px;margin:5vh auto 0}
.mut{color:var(--mut);font-size:.85rem}.err{color:#e5484d;min-height:1.2em;margin:6px 0;font-weight:600}
a{color:var(--or);font-weight:600}
label{display:block;margin:10px 0;font-size:.92rem;font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:12px;font:inherit;font-weight:400;color:var(--fg);background:var(--bg);border:2px solid var(--bd);border-radius:14px}
input[type=checkbox]{display:inline-block;width:auto;margin-right:6px}
button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:999px;background:var(--or);color:#fff;cursor:pointer}
button:active{transform:scale(.97)}
button.sec{background:var(--card);color:var(--fg);border:2px solid var(--bd)}
button.sm{padding:6px 14px;font-size:.82rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.act{display:flex;gap:6px;flex-wrap:wrap}
.lg{max-width:420px;margin:0 auto}.brand{text-align:center;font-weight:800;font-size:1.15rem;padding:10px 0}
.art{height:210px;position:relative;display:flex;align-items:center;justify-content:center}
.big{font-size:6.5rem;line-height:1}
.art span:not(.big){position:absolute;width:58px;height:58px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.b1{left:12%;top:18%;background:#ffd9e6!important}.b2{right:12%;top:30%;background:#dbe3ff!important}.b3{left:24%;bottom:6%;background:#ffe9b8!important}
.dk{background:var(--ink);color:#fff;border-radius:28px;padding:20px 18px 22px;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:22px 22px}
.dk p{margin:0 0 6px;color:#b9b9c0;font-size:.9rem}.dk input{background:#1d1d21;border-color:#303036;color:#fff;margin-bottom:10px}.dk .cta{width:100%;padding:14px}
.hd{background:var(--ink);color:#fff;border-radius:0 0 28px 28px;padding:16px;margin:-12px -12px 14px;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:22px 22px}
.hr{display:flex;justify-content:space-between;gap:10px;align-items:center}.hr .g{display:block;font-size:.85rem;color:#c3c3ca}.nm{font-size:1.25rem}
.ib{width:42px;height:42px;padding:0;border-radius:50%;background:#2c2c31;font-size:1.05rem}
nav{display:flex;gap:8px;margin-bottom:12px}nav button{flex:1}
.sc{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px}
.tl{flex:0 0 128px;text-align:left;border-radius:22px;padding:12px;color:#14131a;background:color-mix(in srgb,var(--c) 45%,#fff);display:flex;flex-direction:column;gap:2px;font-size:.88rem;border:3px solid transparent}
.tl.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--or)}.tl .ti{font-size:1.6rem}.tl .n{font-weight:500;opacity:.8;font-size:.8rem}
.pg{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--or) calc(var(--p)*1%),var(--grb) 0);display:flex;align-items:center;justify-content:center}
.ring i{width:44px;height:44px;border-radius:50%;background:var(--card);font-style:normal;font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center}
.alert{background:color-mix(in srgb,var(--or) 14%,var(--card));border:1px solid color-mix(in srgb,var(--or) 45%,transparent);border-radius:18px;padding:10px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem;font-weight:600}
.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.q{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:16px;font-size:.78rem;font-weight:600;color:var(--fg);background:color-mix(in srgb,var(--c) 16%,var(--card));border:2px solid transparent;text-align:center}
.q span{font-size:1.4rem}.q.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 30%,var(--card))}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.seg button{background:var(--card);color:var(--fg);padding:7px 14px;font-size:.84rem;border:2px solid var(--bd)}.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gh{display:flex;justify-content:space-between;font-weight:800;margin:14px 2px 8px}.gh span{font-weight:600;color:var(--mut);font-size:.85rem}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid transparent;border-radius:22px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.item.nu{border:2px dashed var(--or);background:color-mix(in srgb,var(--or) 9%,var(--card))}
.ic{width:48px;height:48px;border-radius:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:color-mix(in srgb,var(--c) 24%,var(--card))}
.mid{flex:1;min-width:0}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.area{margin-top:4px;font-size:.88rem;font-weight:600;color:var(--or)}
.me{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunb);color:var(--sun)}
.dt{font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--grb);color:var(--mut)}
.dCH{background:var(--sunb);color:var(--sun)}.dTB{background:var(--tbb);color:var(--tb)}
.r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.st{font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c,#888) 16%,var(--card));color:color-mix(in srgb,var(--c,#888) 70%,var(--fg))}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}
.ov{position:fixed;inset:0;background:rgba(10,10,14,.62);display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow:auto;z-index:5}
.ov .card{width:100%;max-width:420px;margin-top:8vh}
.pin{font-size:2.4rem;letter-spacing:.3em;text-align:center;font-weight:800;margin:10px 0;color:var(--or)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;display:none;z-index:9;max-width:90%;font-weight:600}
code{background:var(--grb);padding:1px 6px;border-radius:6px}
</style></head><body>
<main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
const API='https://ihrihhpovslcywzjtjtx.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_a_pTZDIgAbLO4F2_usPJUw_d0dEgNSn';
const ST=['Sẵn sàng','Trực ban','Tuần tra','Tiếp công dân','Giải quyết vụ việc','Công tác khác','Nghỉ phép/bù','Ốm','Học tập/công tác'];
const DUTY={CH:'Chỉ huy',TB:'Trực ban',TC:'Trực chiến'};
const ROLE={ad:'Quản trị',ch:'Chỉ huy',tb:'Trực ban',tc:'Trực chiến',off:'Không có ca trực hôm nay'};
let S={code:'',pin:'',me:null,data:null,view:'board',timer:null,areas:[],areasOk:false,filter:'',group:'duty',locked:[]};
const $=s=>document.querySelector(s), app=$('#app');
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?d.split('-').reverse().join('/'):'';
const when=a=>a?new Date(a).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'';
const cls=s=>['Sẵn sàng','Trực ban'].includes(s)?'ok':['Tuần tra','Tiếp công dân','Giải quyết vụ việc','Công tác khác'].includes(s)?'wa':['Nghỉ phép/bù','Ốm','Học tập/công tác'].includes(s)?'bad':'';
const IC={'Sẵn sàng':'✅','Trực ban':'🛡️','Tuần tra':'🚓','Tiếp công dân':'🤝','Giải quyết vụ việc':'📋','Công tác khác':'💼','Nghỉ phép/bù':'🌴','Ốm':'🤒','Học tập/công tác':'🎓','Chưa cập nhật':'⏳'};
const SCOL={'Sẵn sàng':'#16a34a','Trực ban':'#0d9488','Tuần tra':'#2563eb','Tiếp công dân':'#7c3aed','Giải quyết vụ việc':'#ea580c','Công tác khác':'#db2777','Nghỉ phép/bù':'#ca8a04','Ốm':'#dc2626','Học tập/công tác':'#4f46e5','Chưa cập nhật':'#ff7a1a'};
const DI={CH:'⭐',TB:'🛡️',TC:'⚡'},NU='Chưa cập nhật',PROOF=['Công tác khác','Học tập/công tác'];
const col=s=>SCOL[s]||'#6b7280';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function closeM(){$('#modal').innerHTML=''}
async function rpc(fn,a){
  try{const r=await fetch(API+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(a)});
    const j=await r.json();if(!r.ok)return{ok:false,msg:j.message||'Lỗi máy chủ'};return j}
  catch(e){return{ok:false,msg:'Không kết nối được mạng'}}
}
const auth=()=>({p_code:S.code,p_pin:S.pin});

/* ---- Đăng nhập ---- */
function viewLogin(msg){
  app.innerHTML=`<div class="lg"><div class="brand">🛡️ Điều phối quân số</div>
  <div class="art"><span class="b1">✅</span><span class="b2">📋</span><span class="b3">🚓</span><div class="big">🛡️</div></div>
  <div class="dk"><h1>Chào mừng trở lại</h1><p>Cập nhật trạng thái trực nhanh hơn, dễ hơn.</p>
  <input id="c" autocapitalize="characters" autocomplete="username" placeholder="Mã cán bộ, ví dụ CB07" onkeydown="if(event.key==='Enter')$('#p').focus()">
  <input id="p" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="PIN 4 số" onkeydown="if(event.key==='Enter')doLogin()">
  <p class="err">${esc(msg||'')}</p><button class="cta" onclick="doLogin()">Đăng nhập</button></div></div>`;
}
async function doLogin(){
  const c=$('#c').value.trim().toUpperCase(),p=$('#p').value;
  const r=await rpc('login',{p_code:c,p_pin:p});
  if(!r.ok)return viewLogin(r.msg);
  S.code=c;S.pin=p;S.me=r;r.must_change?viewChange():load();
}
function logout(){clearInterval(S.timer);S={code:'',pin:'',me:null,data:null,view:'board',timer:null,areas:[],areasOk:false,filter:'',group:'duty',locked:[]};closeM();viewLogin()}

/* ---- Đổi PIN ---- */
function viewChange(msg){
  const first=S.me&&S.me.must_change;
  app.innerHTML=`<div class="card narrow"><h1>${first?'Đổi PIN lần đầu':'Đổi PIN'}</h1><p class="mut">PIN mới gồm 4 số, không dùng số lặp hoặc dễ đoán (0000, 1234).</p>
  <label>PIN mới<input id="n1" type="password" inputmode="numeric" maxlength="4"></label>
  <label>Nhập lại PIN mới<input id="n2" type="password" inputmode="numeric" maxlength="4" onkeydown="if(event.key==='Enter')doChange()"></label>
  <p class="err">${esc(msg||'')}</p><div class="act"><button onclick="doChange()">Lưu PIN</button>${first?'':'<button class="sec" onclick="viewBoard()">Hủy</button>'}</div></div>`;
}
async function doChange(){
  const a=$('#n1').value,b=$('#n2').value;
  if(a!==b)return viewChange('Hai lần nhập chưa khớp');
  const r=await rpc('change_pin',{...auth(),p_new:a});
  if(!r.ok)return viewChange(r.msg);
  S.pin=a;S.me.must_change=false;toast('Đã đổi PIN');load();
}

/* ---- Bảng điều phối ---- */
async function load(){
  const r=await rpc('board',auth());
  if(!r.ok){if(S.data)toast(r.msg);else viewLogin(r.msg);return}
  if(!S.areasOk){const a=await rpc('get_areas',auth());if(a.ok){S.areas=a.areas;S.areasOk=true}}
  S.data=r;if(r.role==='ad'){const a=await rpc('admin_list',auth());if(a.ok)S.locked=a.officers.filter(o=>o.locked)}
  if(S.view==='board')viewBoard();
  clearInterval(S.timer);S.timer=setInterval(()=>{if(S.view==='board'&&!$('#modal').innerHTML)load()},30000);
}
const ini=l=>((String(l||'?').trim().split(/\s+/).pop())||'?').charAt(0).toUpperCase();
function head(){
  const d=S.data,hr=new Date().getHours(),g=hr<11?'Chào buổi sáng':hr<14?'Chào buổi trưa':hr<18?'Chào buổi chiều':'Chào buổi tối';
  const me=d.rows.find(r=>r.code===d.code);
  const sub=me?`Hôm nay bạn trực: ${DI[me.duty]} ${DUTY[me.duty]}`:d.role==='ad'?'Chế độ quản trị':'Hôm nay bạn không có ca trực';
  return `<header class="hd"><div class="hr"><div><span class="g">${g} 👋</span><b class="nm">${esc(d.label)}</b><span class="g">${sub}</span></div>
  <div class="act"><button class="ib" title="Làm mới" onclick="load()">🔄</button><button class="ib" title="Đổi PIN" onclick="viewChange()">🔑</button><button class="ib" title="Thoát" onclick="logout()">🚪</button></div></div></header>`+
  (d.role==='ad'?`<nav><button class="${S.view==='board'?'':'sec'}" onclick="S.view='board';viewBoard()">📊 Bảng quân số</button><button class="${S.view==='admin'?'':'sec'}" onclick="viewAdmin()">⚙️ Quản trị</button></nav>`:'');
}
function setF(k){S.filter=S.filter===k?'':k;viewBoard()}
function setG(k){S.group=k;viewBoard()}
function item(r){
  const d=S.data,can=r.code===d.code||d.role==='tb',nu=r.st===NU;
  return `<div class="item ${nu?'nu':''}" style="--c:${col(r.st)}"><div class="ic">${IC[r.st]||'❔'}</div>
  <div class="mid"><b>${esc(r.label)}</b>${r.code===d.code?' <span class="me">Bạn</span>':''}
  <div class="meta"><span class="dt d${esc(r.duty)}">${DI[r.duty]||''} ${DUTY[r.duty]||''}</span><span class="mut">${esc(r.code)} · Ca ${esc(r.team)}</span></div>
  ${r.area?`<div class="area">📍 ${esc(r.area)}</div>`:''}</div>
  <div class="r"><span class="st">${IC[r.st]||''} ${esc(r.st)}</span><span class="mut">${when(r.at)}</span>${can?`<button class="sm" onclick="edit('${esc(r.code)}')">Cập nhật</button>`:''}</div></div>`;
}
function viewBoard(){
  S.view='board';const d=S.data,rows=d.rows,cnt={},f=S.filter;
  const me=rows.find(r=>r.code===d.code),nu=rows.filter(r=>r.st===NU);
  rows.forEach(r=>cnt[r.st]=(cnt[r.st]||0)+1);
  const pct=rows.length?Math.round((rows.length-nu.length)*100/rows.length):0;
  let h=head();
  if(me&&PROOF.includes(me.st))h+=`<div class="alert"><span>📎 Bạn đang ${esc(me.st)}. Hãy gửi minh chứng cho trực ban.</span><button class="sm" onclick="proof()">Gửi qua Zalo</button></div>`;
  if(['tb','ch','ad'].includes(d.role)&&nu.length)h+=`<div class="alert"><span>⏳ ${nu.length} người chưa cập nhật trạng thái.</span><button class="sm" onclick="nudge()">Nhắc qua Zalo</button></div>`;
  if(d.role==='ad'&&S.locked.length)h+=`<div class="alert"><span>🔒 ${S.locked.length} tài khoản đang bị khóa: ${S.locked.map(o=>esc(o.code)).join(', ')}</span><button class="sm" onclick="viewAdmin()">Mở khóa</button></div>`;
  if(me)h+=`<div class="card"><h2>⚡ Cập nhật nhanh trạng thái của bạn</h2><div class="qg">${ST.map(s=>`<button class="q ${me.st===s?'on':''}" style="--c:${col(s)}" onclick="quickSet('${s}')"><span>${IC[s]}</span>${s}</button>`).join('')}</div>
  <div class="mut" style="margin-top:8px">📍 ${me.area?esc(me.area):'Chưa chọn địa bàn'} · <a href="#" onclick="edit('${esc(me.code)}');return false">Đổi địa bàn</a></div></div>`;
  h+=`<div class="card pg"><div><b>Đã cập nhật ${rows.length-nu.length}/${rows.length} người</b><div class="mut">Ngày trực ${fmt(d.day)}${d.next?' · Ca kế tiếp của bạn '+fmt(d.next):''}</div></div><div class="ring" style="--p:${pct}"><i>${pct}%</i></div></div>`;
  h+=`<div class="sc">${Object.keys(cnt).map(k=>`<button class="tl ${f===k?'on':''}" style="--c:${col(k)}" onclick="setF('${k}')"><span class="ti">${IC[k]||'❔'}</span><b>${esc(k)}</b><span class="n">${cnt[k]} người</span></button>`).join('')}</div>`;
  h+=`<div class="seg"><span class="mut">Nhóm theo:</span>${[['duty','Nhiệm vụ'],['area','Địa bàn'],['st','Trạng thái']].map(([k,t])=>`<button class="${S.group===k?'on':''}" onclick="setG('${k}')">${t}</button>`).join('')}${f?`<button class="sm" onclick="setF('')">Bỏ lọc: ${esc(f)} ✕</button>`:''}</div>`;
  const list=rows.filter(r=>!f||r.st===f),gk=r=>S.group==='area'?(r.area||'Chưa ghi địa bàn'):S.group==='st'?r.st:DUTY[r.duty],g={};
  list.forEach(r=>(g[gk(r)]=g[gk(r)]||[]).push(r));
  h+=rows.length?Object.keys(g).map(k=>`<div class="gh">${S.group==='st'?(IC[k]||'')+' ':''}${esc(k)}<span>${g[k].length} người</span></div>`+g[k].map(item).join('')).join('')
    :`<div class="card"><p class="mut">Hôm nay chưa có lịch trực. Quản trị cần nhập lịch ở mục Quản trị.</p></div>`;
  if(d.log&&d.log.length)h+=`<div class="card"><h2>🕘 Hoạt động gần đây</h2>${d.log.map(l=>`<div class="row"><span>${esc(l.what)}</span><span class="mut">${when(l.at)}</span></div>`).join('')}</div>`;
  app.innerHTML=h;
}
function edit(code){
  const r=S.data.rows.find(x=>x.code===code);
  $('#modal').innerHTML=`<div class="ov"><div class="card"><h2>${esc(r.label)}</h2>
  <label>Trạng thái<select id="es">${ST.map(s=>`<option ${s===r.st?'selected':''}>${s}</option>`).join('')}</select></label>
  ${areaField(r.area)}
  <p class="err" id="em"></p><div class="act"><button onclick="saveSt('${esc(code)}')">Lưu trạng thái</button><button class="sec" onclick="closeM()">Hủy</button></div></div></div>`;
}
function areaField(cur){
  cur=cur||'';const L=S.areas;
  if(!L.length)return `<label>Địa bàn / ghi chú<input id="ea" maxlength="60" value="${esc(cur)}"></label>`;
  const inList=!cur||L.includes(cur);
  return `<label>Địa bàn<select id="eas" onchange="$('#ea').style.display=this.value==='__o'?'block':'none'"><option value="">(Không chọn)</option>${L.map(a=>`<option ${a===cur?'selected':''}>${esc(a)}</option>`).join('')}<option value="__o" ${inList?'':'selected'}>Khác (nhập tay)</option></select>
  <input id="ea" maxlength="60" placeholder="Nhập địa bàn khác" value="${inList?'':esc(cur)}" style="display:${inList?'none':'block'}"></label>`;
}
function areaVal(){const s=$('#eas');if(!s)return $('#ea').value.trim();return s.value==='__o'?$('#ea').value.trim():s.value}
async function saveSt(code){
  const st=$('#es').value,r=await rpc('set_status',{...auth(),p_target:code,p_st:st,p_area:areaVal()});
  if(!r.ok){$('#em').textContent=r.msg;return}
  closeM();toast('Đã lưu');await load();
  if(code===S.data.code&&PROOF.includes(st))proof();
}
async function quickSet(s){
  const d=S.data,me=d.rows.find(r=>r.code===d.code);
  const r=await rpc('set_status',{...auth(),p_target:d.code,p_st:s,p_area:(me&&me.area)||''});
  if(!r.ok)return toast(r.msg);
  toast('Đã cập nhật: '+s);await load();
  if(PROOF.includes(s))proof();
}
function proof(){
  const d=S.data,me=d.rows.find(r=>r.code===d.code);if(!me)return;
  const tb=d.rows.filter(r=>r.duty==='TB'&&r.code!==d.code).map(r=>r.label).join(', ')||'trực ban';
  const msg=`[Báo trực ${fmt(d.day)}] ${me.label} (${me.code}): ${me.st}${me.area?' - '+me.area:''}. Gửi ${tb}, minh chứng đính kèm.`;
  $('#modal').innerHTML=`<div class="ov"><div class="card"><h2>📎 Gửi minh chứng cho trực ban</h2>
  <p class="mut">Bạn đang <b>${esc(me.st)}</b>. Chụp hoặc chọn ảnh giấy mời, giấy giới thiệu, quyết định rồi gửi qua Zalo cho: <b>${esc(tb)}</b>.</p>
  <label>Ảnh minh chứng<input id="pf" type="file" accept="image/*" multiple></label>
  <label>Nội dung gửi<textarea id="pm" rows="3">${esc(msg)}</textarea></label>
  <div class="act"><button onclick="sendZalo()">Gửi qua Zalo</button><button class="sec" onclick="closeM()">Để sau</button></div></div></div>`;
}
async function sendZalo(){
  const msg=$('#pm').value,files=[...$('#pf').files],data={text:msg};
  if(files.length&&navigator.canShare&&navigator.canShare({files}))data.files=files;
  if(navigator.share){try{await navigator.share(data);closeM();return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(msg);toast('Đã chép nội dung. Mở Zalo, dán và đính kèm ảnh.')}catch(e){toast('Hãy tự chép nội dung vào Zalo')}
  window.open('https://zalo.me','_blank');
}
async function nudge(){
  const d=S.data,n=d.rows.filter(r=>r.st===NU).map(r=>r.label+' ('+r.code+')').join(', ');
  const msg=`[Nhắc trực ${fmt(d.day)}] Các đồng chí chưa cập nhật trạng thái: ${n}. Vui lòng cập nhật trên bảng điều phối.`;
  if(navigator.share){try{await navigator.share({text:msg});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(msg);toast('Đã chép lời nhắc, dán vào nhóm Zalo')}catch(e){toast('Không chép được, hãy tự soạn lời nhắc')}
}
/* ---- Quản trị ---- */
async function viewAdmin(){
  S.view='admin';
  const r=await rpc('admin_list',auth());
  if(!r.ok){toast(r.msg);S.view='board';return}
  const ar=await rpc('get_areas',auth());if(ar.ok){S.areas=ar.areas;S.areasOk=true}
  S.locked=r.officers.filter(o=>o.locked);
  const opt=(v,t)=>`<option value="${v}">${t}</option>`;
  app.innerHTML=head()+`${S.locked.length?`<div class="alert"><span>🔒 Tài khoản đang bị khóa: ${S.locked.map(o=>`<b>${esc(o.code)}</b> ${esc(o.label)}`).join(' · ')}</span><span class="act">${S.locked.map(o=>`<button class="sm" onclick="resetPin('${esc(o.code)}')">Mở khóa ${esc(o.code)}</button>`).join('')}</span></div>`:''}
  <div class="card"><h2>Danh sách cán bộ (${r.officers.length})</h2>`+
  r.officers.map(o=>`<div class="row"><div><b>${esc(o.code)}</b> ${esc(o.label)}<div class="mut">${o.kind}${o.team?' · Ca '+o.team:''}${o.active?'':' · Đã ngừng'}${o.locked?' · ĐANG KHÓA':''}${o.must_change?' · Chưa đổi PIN':''}</div></div>
  <div class="act"><button class="sec" onclick='fillOff(${JSON.stringify(o).replace(/'/g,"&#39;")})'>Sửa</button><button class="sec" onclick="resetPin('${esc(o.code)}')">Đặt lại PIN</button></div></div>`).join('')+`</div>
  <div class="card"><h2>Thêm hoặc sửa cán bộ</h2>
  <label>Mã (ví dụ CB07)<input id="oc" autocapitalize="characters"></label>
  <label>Tên hiển thị<input id="ol"></label>
  <label>Loại<select id="ok">${opt('CB','CB: Cán bộ')+opt('CH','CH: Chỉ huy')+opt('QT','QT: Quản trị')}</select></label>
  <label>Ca mặc định<select id="ot">${opt('','Không có')+opt('A','Ca A')+opt('B','Ca B')+opt('C','Ca C')}</select></label>
  <label><input type="checkbox" id="oa" checked>Đang hoạt động</label>
  <p class="mut">Mã mới sẽ được cấp PIN tạm ngẫu nhiên, hiện một lần duy nhất.</p>
  <button onclick="saveOff()">Lưu cán bộ</button></div>
  <div class="card"><h2>Danh sách địa bàn</h2>
  <p class="mut">Mỗi dòng một địa bàn. Cán bộ sẽ chọn trong danh sách này khi cập nhật trạng thái. Lưu sẽ thay toàn bộ danh sách cũ.</p>
  <textarea id="ar" rows="6">${esc(S.areas.join('\n'))}</textarea>
  <p class="err" id="are"></p><button onclick="saveAreas()">Lưu danh sách địa bàn</button></div>
  <div class="card"><h2>Nhập lịch trực</h2>
  <p class="mut">Mỗi dòng một người: <code>ngày,ca,mã,nhiệm vụ</code>. Ví dụ <code>2026-11-14,A,CB06,TB</code>. Nhiệm vụ: CH (chỉ huy), TB (trực ban), TC (trực chiến). Ngày nào có trong dữ liệu sẽ được thay mới hoàn toàn.</p>
  <textarea id="im" rows="8" placeholder="2026-11-14,A,CB01,CH"></textarea>
  <p class="err" id="ie"></p><button onclick="doImport()">Nhập lịch</button></div>`;
}
function fillOff(o){$('#oc').value=o.code;$('#ol').value=o.label;$('#ok').value=o.kind;$('#ot').value=o.team||'';$('#oa').checked=o.active;$('#oc').scrollIntoView({behavior:'smooth'})}
function pinBox(title,code,pin){
  $('#modal').innerHTML=`<div class="ov"><div class="card"><h2>${esc(title)} ${esc(code)}</h2><div class="pin">${esc(pin)}</div><p class="mut">Ghi lại và gửi riêng cho cán bộ. PIN này chỉ hiện một lần, người dùng sẽ phải đổi ngay khi đăng nhập.</p><button onclick="closeM()">Đã ghi lại</button></div></div>`;
}
async function saveOff(){
  const code=$('#oc').value.trim().toUpperCase();
  if(!code||!$('#ol').value.trim())return toast('Cần nhập mã và tên');
  const r=await rpc('admin_save_officer',{...auth(),o_code:code,o_label:$('#ol').value.trim(),o_kind:$('#ok').value,o_team:$('#ot').value,o_active:$('#oa').checked});
  if(!r.ok)return toast(r.msg);
  if(r.pin)pinBox('PIN tạm của',code,r.pin);else toast('Đã lưu');
  viewAdmin();
}
async function resetPin(code){
  if(!confirm('Đặt lại PIN cho '+code+'?'))return;
  const r=await rpc('admin_reset_pin',{...auth(),o_code:code});
  if(!r.ok)return toast(r.msg);
  pinBox('PIN tạm mới của',code,r.pin);viewAdmin();
}
async function doImport(){
  const rows=[];let bad='';
  $('#im').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
    const p=l.split(/[,;\t]/).map(x=>x.trim());
    if(i===0&&!/^\d{4}-\d{2}-\d{2}$/.test(p[0]))return;
    if(p.length<4||!/^\d{4}-\d{2}-\d{2}$/.test(p[0])||!['A','B','C'].includes(p[1].toUpperCase())||!['CH','TB','TC'].includes(p[3].toUpperCase()))bad=bad||'Dòng sai: '+l;
    else rows.push({day:p[0],team:p[1],code:p[2],duty:p[3]});
  });
  if(bad)return $('#ie').textContent=bad;
  if(!rows.length)return $('#ie').textContent='Chưa có dòng nào';
  const r=await rpc('admin_import',{...auth(),p_rows:rows});
  if(!r.ok)return $('#ie').textContent=r.msg;
  $('#ie').textContent='';toast('Đã nhập '+r.n+' dòng lịch');$('#im').value='';
}
async function saveAreas(){
  const names=$('#ar').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const r=await rpc('admin_save_areas',{...auth(),p_names:names});
  if(!r.ok)return $('#are').textContent=r.msg;
  $('#are').textContent='';S.areas=names;toast('Đã lưu '+r.n+' địa bàn');
}
viewLogin();
</script></body></html>
