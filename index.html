<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F4F5F9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Điều phối">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bảng điều phối quân số</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --font-main: "Plus Jakarta Sans", "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, sans-serif;
  --bg: #E9ECEF;
  --app-bg: #F8F9FD;
  --card-bg: #FFFFFF;
  --text-primary: #0F172A;
  --text-secondary: #64748B;
  --text-muted: #94A3B8;
  --border: #F1F5F9;
  --border-dark: #E2E8F0;
  --primary: #1E293B;
  --primary-orange: #FF6B00;
  --primary-navy: #1B2559;
  --primary-blue: #2563EB;
  --accent-teal: #0D9488;
  --accent-purple: #7C3AED;
  --sh-card: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
  --sh-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  padding:0;
  color:var(--text-primary);
  font:14px/1.5 var(--font-main);
  background-color:var(--bg);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
}
main{
  width:100%;
  max-width:420px;
  background:var(--app-bg);
  min-height:100vh;
  padding:16px 16px 24px;
  position:relative;
  box-shadow:0 0 40px rgba(0,0,0,0.1);
}
@media (min-width: 440px) {
  main {
    margin:20px 0;
    min-height: calc(100vh - 40px);
    border-radius:36px;
    padding:20px;
  }
}

/* Typography & General */
h1{font-size:1.4rem;font-weight:800;margin:0 0 4px;color:var(--text-primary);letter-spacing:-0.02em}
h2{font-size:1.05rem;font-weight:700;margin:0 0 12px;color:var(--text-primary);letter-spacing:-0.01em}
.mut{color:var(--text-secondary);font-size:.82rem}
.err{color:#DC2626;min-height:1.2em;margin:8px 0;font-weight:600;font-size:.85rem}
a{color:var(--primary-orange);font-weight:600;text-decoration:none}
button{
  font:600 .88rem var(--font-main);
  padding:10px 16px;
  border:0;
  border-radius:24px;
  background:var(--primary);
  color:#FFF;
  cursor:pointer;
  transition:all .15s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
button:active{transform:scale(0.97)}
button.sec{background:#F1F5F9;color:var(--text-primary);border:1px solid var(--border-dark)}
button.sm{padding:6px 14px;font-size:.78rem;border-radius:18px}
button.pill{border-radius:99px}

input,select,textarea{
  display:block;
  width:100%;
  margin-top:6px;
  padding:12px 14px;
  font:inherit;
  color:var(--text-primary);
  background:#FFFFFF;
  border:1px solid var(--border-dark);
  border-radius:16px;
  outline:none;
  transition:border .15s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary-orange)}

/* Cards UI based on design */
.card{
  background:var(--card-bg);
  border-radius:24px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--sh-card);
  border:1px solid rgba(241, 245, 249, 0.8);
}
.act{display:flex;gap:8px;flex-wrap:wrap}

/* Header UI */
.hd-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  padding:4px 2px;
}
.hd-time{font-size:.8rem;font-weight:700;color:var(--text-primary)}
.hd-user-tag{
  display:flex;
  align-items:center;
  gap:8px;
  background:#FFF;
  padding:6px 12px;
  border-radius:99px;
  box-shadow:var(--sh-sm);
}
.hd-user-tag .avatar{
  width:26px;
  height:26px;
  background:var(--primary-orange);
  color:#FFF;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:.75rem;
}
.hd-user-tag span{font-weight:700;font-size:.82rem}
.top-actions{display:flex;gap:6px}
.ib{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#FFF;
  border:1px solid var(--border-dark);
  color:var(--text-secondary);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.ib:hover{color:var(--text-primary);background:#F8FAFC}

/* Navigation Tabs */
nav{
  display:flex;
  background:#E2E8F0;
  padding:4px;
  border-radius:99px;
  margin-bottom:16px;
}
nav button{
  flex:1;
  background:transparent;
  color:var(--text-secondary);
  border-radius:99px;
  border:0;
  padding:8px 12px;
  font-size:.82rem;
  font-weight:600;
}
nav button.active{
  background:#FFF;
  color:var(--text-primary);
  box-shadow:var(--sh-sm);
}

/* Stat Banner Hero */
.hero-stat{
  text-align:center;
  padding:10px 0 16px;
}
.hero-stat .val{
  font-size:2.4rem;
  font-weight:800;
  letter-spacing:-0.03em;
  color:var(--text-primary);
  line-height:1.1;
}
.hero-stat .sub{
  font-size:.82rem;
  color:var(--text-secondary);
  margin-top:4px;
}
.badge-pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 12px;
  border-radius:99px;
  font-size:.75rem;
  font-weight:700;
  background:#F1F5F9;
  color:var(--text-secondary);
  margin-top:8px;
  border:1px solid var(--border-dark);
}

/* Donut Chart Component */
.donut-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding:12px 0;
}
.donut-box .center-val{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -60%);
  text-align:center;
}
.donut-box .center-val b{font-size:1.8rem;font-weight:800;display:block;line-height:1}
.donut-box .center-val span{font-size:.7rem;color:var(--text-muted);font-weight:600;text-transform:uppercase}

/* Stat Cards Row */
.stat-cards-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  margin-top:14px;
}
.sc-item{
  background:#F8FAFC;
  border-radius:16px;
  padding:12px 10px;
  text-align:center;
  border:1px solid var(--border);
  cursor:pointer;
  transition:all .15s ease;
}
.sc-item.on{
  background:#FFF;
  border-color:var(--primary-orange);
  box-shadow:0 4px 12px rgba(255,107,0,0.12);
}
.sc-item .num{font-size:1.1rem;font-weight:800;color:var(--text-primary)}
.sc-item .lbl{font-size:.7rem;color:var(--text-secondary);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-item .bar-indicator{height:3px;border-radius:99px;margin-top:6px;width:100%}

/* Quick Actions Grid */
.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.q{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px 8px;
  border-radius:16px;
  border:1px solid var(--border-dark);
  background:#FFF;
  color:var(--text-primary);
  font:600 .75rem var(--font-main);
  text-align:center;
  gap:6px;
}
.q.on{
  border-color:var(--primary-orange);
  background:#FFF7ED;
  color:var(--primary-orange);
}
.dot-sm{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Segmented Buttons Filter */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:12px 0}
.seg button{
  background:#FFF;
  color:var(--text-secondary);
  padding:6px 14px;
  font-size:.78rem;
  border:1px solid var(--border-dark);
  border-radius:99px;
  white-space:nowrap;
}
.seg button.on{
  background:var(--primary-navy);
  color:#FFF;
  border-color:var(--primary-navy);
}

/* User Items List */
.gh{
  font-size:.82rem;
  font-weight:700;
  color:var(--text-secondary);
  margin:16px 4px 8px;
  display:flex;
  justify-content:space-between;
}
.item{
  display:flex;
  gap:12px;
  align-items:center;
  background:#FFF;
  border:1px solid var(--border);
  border-radius:20px;
  padding:12px 14px;
  margin-bottom:8px;
  box-shadow:var(--sh-sm);
  position:relative;
}
.item.nu{background:#FFFBEB;border-color:#FDE68A}
.av{
  width:40px;
  height:40px;
  border-radius:14px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:1rem;
  color:#FFF;
  background:var(--primary-navy);
}
.mid{flex:1;min-width:0}
.mid b{font-size:.92rem;color:var(--text-primary);display:block}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.area{margin-top:4px;font-size:.78rem;font-weight:600;color:var(--primary-blue)}
.me{font-size:.68rem;font-weight:700;padding:2px 6px;border-radius:6px;background:#EFF6FF;color:var(--primary-blue)}
.dt{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;background:#F1F5F9;color:var(--text-secondary)}
.st-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:.75rem;
  font-weight:700;
  padding:4px 10px;
  border-radius:99px;
}

/* Modals & Toasts */
.ov{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99}
.ov .card{width:100%;max-width:380px;margin:0}
.pin{font:800 2.4rem var(--font-main);letter-spacing:.25em;text-align:center;margin:12px 0;color:var(--primary-orange)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--primary-navy);color:#FFF;padding:10px 20px;border-radius:99px;display:none;z-index:100;font-size:.85rem;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.2)}
.alert{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;padding:12px 14px;font-size:.82rem;font-weight:600;border-radius:16px;background:#FFF7ED;color:#C2410C;border:1px solid #FFEDD5}

/* Login Screen */
.lg{padding:40px 10px 20px;text-align:center}
.lg .logo-icon{width:64px;height:64px;background:var(--primary-orange);color:#FFF;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 10px 25px rgba(255,107,0,0.3)}
.lg h1{font-size:1.6rem;margin-bottom:6px}
.lg p{color:var(--text-secondary);font-size:.88rem;margin-bottom:24px}
.lg input{margin-bottom:12px;text-align:center;font-size:1rem;letter-spacing:1px}
.lg button.cta{width:100%;padding:14px;border-radius:99px;background:var(--primary-orange);font-size:1rem;margin-top:8px;box-shadow:0 8px 20px rgba(255,107,0,0.25)}
</style></head><body>
<main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
const API='https://ihrihhpovslcywzjtjtx.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_a_pTZDIgAbLO4F2_usPJUw_d0dEgNSn';
const ST=['Sẵn sàng','Trực ban','Tuần tra','Tiếp công dân','Giải quyết vụ việc','Công tác khác','Nghỉ phép/bù','Ốm','Học tập/công tác'];
const DUTY={CH:'Chỉ huy',TB:'Trực ban',TC:'Trực chiến'};
const KIND={CB:'Cán bộ',CH:'Chỉ huy',TR:'Trưởng CA',QT:'Quản trị'};
const TEAM0='A';
let S={code:'',pin:'',me:null,data:null,view:'board',timer:null,areas:[],areasOk:false,filter:'',group:'duty',locked:[],ovDay:''};

const $=s=>document.querySelector(s), app=$('#app');
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?d.split('-').reverse().join('/'):'';
const when=a=>a?new Date(a).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'';

const SCOL={
  'Sẵn sàng':'#10B981',
  'Trực ban':'#0D9488',
  'Tuần tra':'#2563EB',
  'Tiếp công dân':'#7C3AED',
  'Giải quyết vụ việc':'#EA580C',
  'Công tác khác':'#DB2777',
  'Nghỉ phép/bù':'#D97706',
  'Ốm':'#EF4444',
  'Học tập/công tác':'#6366F1',
  'Chưa cập nhật':'#94A3B8'
};
const NU='Chưa cập nhật',PROOF=['Công tác khác','Học tập/công tác'];
const col=s=>SCOL[s]||'#64748B';

const svg=(p,w)=>`<svg viewBox="0 0 24 24" width="${w||18}" height="${w||18}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const nowT=()=>new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});

setInterval(()=>{const e=$('#clk');if(e)e.textContent=nowT()},1000);

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function closeM(){$('#modal').innerHTML=''}

async function rpc(fn,a){
  try{
    const r=await fetch(API+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(a)});
    const j=await r.json();
    if(!r.ok)return{ok:false,msg:j.message||'Lỗi máy chủ'};
    return j;
  }catch(e){return{ok:false,msg:'Không kết nối được mạng'}}
}
const auth=()=>({p_code:S.code,p_pin:S.pin});

/* UI Donut Generator based on design image */
function renderDonut(done, total){
  const pct = total ? Math.round((done / total) * 100) : 0;
  const dashoffset = 283 - (283 * pct) / 100;
  return `
    <div class="donut-box">
      <svg width="140" height="140" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#F1F5F9" stroke-width="12" />
        <circle cx="50" cy="50" r="42" fill="none" stroke="#FF6B00" stroke-width="12"
          stroke-dasharray="264" stroke-dashoffset="${264 - (264 * done / Math.max(total, 1))}"
          stroke-linecap="round" transform="rotate(-90 50 50)"/>
      </svg>
      <div class="center-val">
        <b>${done}</b>
        <span>TỔNG KHAI BÁO</span>
      </div>
    </div>
  `;
}

/* Đăng nhập */
function viewLogin(msg){
  app.innerHTML=`<div class="lg">
    <div class="logo-icon">${svg('<path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/>',32)}</div>
    <h1>Điều phối quân số</h1>
    <p>Công an phường Tam Quan</p>
    <div class="card" style="text-align:left">
      <label class="mut">Mã cán bộ</label>
      <input id="c" autocapitalize="characters" autocomplete="username" placeholder="Ví dụ: CB07" onkeydown="if(event.key==='Enter')$('#p').focus()">
      <label class="mut" style="margin-top:10px;display:block">Mã PIN 4 số</label>
      <input id="p" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
      <p class="err">${esc(msg||'')}</p>
      <button class="cta" onclick="doLogin()">Đăng nhập</button>
    </div>
  </div>`;
}

async function doLogin(){
  const c=$('#c').value.trim().toUpperCase(),p=$('#p').value;
  const r=await rpc('login',{p_code:c,p_pin:p});
  if(!r.ok)return viewLogin(r.msg);
  S.code=c;S.pin=p;S.me=r;r.must_change?viewChange():load();
}

function logout(){
  clearInterval(S.timer);
  S={code:'',pin:'',me:null,data:null,view:'board',timer:null,areas:[],areasOk:false,filter:'',group:'duty',locked:[],ovDay:''};
  closeM();
  viewLogin();
}

/* Đổi PIN */
function viewChange(msg){
  const first=S.me&&S.me.must_change;
  app.innerHTML=`<div class="card" style="margin-top:40px">
    <h2>${first?'Đổi PIN lần đầu':'Đổi PIN'}</h2>
    <p class="mut">Tạo mã PIN 4 số bảo mật cho tài khoản của bạn.</p>
    <label class="mut">PIN mới</label>
    <input id="n1" type="password" inputmode="numeric" maxlength="4">
    <label class="mut" style="margin-top:10px;display:block">Nhập lại PIN mới</label>
    <input id="n2" type="password" inputmode="numeric" maxlength="4" onkeydown="if(event.key==='Enter')doChange()">
    <p class="err">${esc(msg||'')}</p>
    <div class="act" style="margin-top:14px">
      <button style="flex:1" onclick="doChange()">Lưu PIN</button>
      ${first?'':'<button class="sec" onclick="viewBoard()">Hủy</button>'}
    </div>
  </div>`;
}

async function doChange(){
  const a=$('#n1').value,b=$('#n2').value;
  if(a!==b)return viewChange('Hai lần nhập chưa khớp');
  const r=await rpc('change_pin',{...auth(),p_new:a});
  if(!r.ok)return viewChange(r.msg);
  S.pin=a;S.me.must_change=false;toast('Đã đổi PIN');load();
}

/* Load Data */
async function load(){
  const r=await rpc('board',auth());
  if(!r.ok){if(S.data)toast(r.msg);else viewLogin(r.msg);return}
  if(!S.areasOk){const a=await rpc('get_areas',auth());if(a.ok){S.areas=a.areas;S.areasOk=true}}
  if(r.kind==='TR'){const o=await rpc('tr_overview',{...auth(),p_day:null});if(o.ok)r.log=o.log.slice(0,12)}
  S.data=r;if(r.role==='ad'){const a=await rpc('admin_list',auth());if(a.ok)S.locked=a.officers.filter(o=>o.locked)}
  if(S.view==='board')viewBoard();else if(S.view==='ov')viewOverview(S.ovDay);
  clearInterval(S.timer);S.timer=setInterval(()=>{if(S.view==='board'&&!$('#modal').innerHTML)load()},30000);
}

const ini=l=>((String(l||'?').trim().split(/\s+/).pop())||'?').charAt(0).toUpperCase();

function renderHeader(){
  const d=S.data;
  return `
    <div class="hd-bar">
      <div class="hd-user-tag">
        <div class="avatar">${ini(d.label)}</div>
        <span>${esc(d.label)}</span>
      </div>
      <div class="top-actions">
        <button class="ib" title="Làm mới" onclick="load()">${svg('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>')}</button>
        <button class="ib" title="Đổi PIN" onclick="viewChange()">${svg('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>')}</button>
        <button class="ib" title="Thoát" onclick="logout()">${svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>')}</button>
      </div>
    </div>
  `;
}

function renderNav(){
  const d=S.data;
  if(d.role==='ad'){
    return `<nav>
      <button class="${S.view==='board'?'active':''}" onclick="S.view='board';viewBoard()">Quân số</button>
      <button class="${S.view==='admin'?'active':''}" onclick="viewAdmin()">Quản trị</button>
    </nav>`;
  }
  if(d.kind==='TR'){
    return `<nav>
      <button class="${S.view==='board'?'active':''}" onclick="S.view='board';viewBoard()">Hôm nay</button>
      <button class="${S.view==='ov'?'active':''}" onclick="viewOverview()">Các ngày</button>
    </nav>`;
  }
  return '';
}

function setF(k){S.filter=S.filter===k?'':k;viewBoard()}
function setG(k){S.group=k;viewBoard()}

function item(r){
  const d=S.data,can=r.code===d.code||d.role==='tb',nu=r.st===NU;
  return `
    <div class="item ${nu?'nu':''}">
      <div class="av" style="background:${col(r.st)}">${esc(ini(r.label))}</div>
      <div class="mid">
        <b>${esc(r.label)} ${r.code===d.code?'<span class="me">Bạn</span>':''}</b>
        <div class="meta">
          <span class="dt">${DUTY[r.duty]||''}</span>
          <span class="mut">${esc(r.code)}</span>
        </div>
        ${r.area?`<div class="area">📍 ${esc(r.area)}</div>`:''}
      </div>
      <div style="text-align:right">
        <div class="st-badge" style="background:${col(r.st)}15;color:${col(r.st)}">
          <span class="dot-sm" style="background:${col(r.st)}"></span>${esc(r.st)}
        </div>
        <div class="mut" style="font-size:.7rem;margin-top:2px">${when(r.at)}</div>
        ${can?`<button class="sm pill sec" style="margin-top:4px" onclick="edit('${esc(r.code)}')">Cập nhật</button>`:''}
      </div>
    </div>
  `;
}

function viewBoard(){
  S.view='board';
  const d=S.data, rows=d.rows, cnt={}, f=S.filter;
  const me=rows.find(r=>r.code===d.code), nu=rows.filter(r=>r.st===NU);
  rows.forEach(r=>cnt[r.st]=(cnt[r.st]||0)+1);
  const doneCount = rows.length - nu.length;

  let h = renderHeader();
  h += renderNav();

  if(me && PROOF.includes(me.st)){
    h += `<div class="alert"><span>Bạn đang ${esc(me.st)}. Gửi minh chứng cho trực ban.</span><button class="sm pill" onclick="proof()">Gửi Zalo</button></div>`;
  }
  if((['tb','ch','ad'].includes(d.role)||d.kind==='TR')&&nu.length){
    h += `<div class="alert"><span>${nu.length} cán bộ chưa khai báo.</span><button class="sm pill" onclick="nudge()">Nhắc Zalo</button></div>`;
  }

  // Hero Stat UI according to Image Design
  h += `<div class="card" style="padding-bottom:12px">
    <div class="hero-stat">
      <div class="mut" style="font-size:.78rem;font-weight:700;letter-spacing:0.05em">BẢNG QUÂN SỐ TỔNG THỂ</div>
      <div class="val">${rows.length}</div>
      <div class="badge-pill">Ngày trực: ${fmt(d.day)}</div>
    </div>
    ${renderDonut(doneCount, rows.length)}
    
    <div class="stat-cards-grid">
      ${Object.keys(cnt).slice(0,6).map(k=>`
        <div class="sc-item ${f===k?'on':''}" onclick="setF('${k}')">
          <div class="num">${cnt[k]}</div>
          <div class="lbl">${esc(k)}</div>
          <div class="bar-indicator" style="background:${col(k)}"></div>
        </div>
      `).join('')}
    </div>
  </div>`;

  // Quick Action Box for the current logged-in user
  if(me){
    h += `<div class="card">
      <h2>Cập nhật nhanh trạng thái</h2>
      <div class="qg">
        ${ST.map(s=>`
          <button class="q ${me.st===s?'on':''}" onclick="quickSet('${s}')">
            <span class="dot-sm" style="background:${col(s)}"></span>
            ${s}
          </button>
        `).join('')}
      </div>
      <div class="mut" style="margin-top:12px;text-align:center">
        Địa bàn hiện tại: <b>${me.area?esc(me.area):'Chưa chọn'}</b> · 
        <a href="#" onclick="edit('${esc(me.code)}');return false">Đổi địa bàn</a>
      </div>
    </div>`;
  }

  // List & Grouping
  h += `<div class="seg">
    <span class="mut" style="align-self:center;margin-right:4px">Nhóm:</span>
    ${[['duty','Nhiệm vụ'],['area','Địa bàn'],['st','Trạng thái']].map(([k,t])=>`
      <button class="${S.group===k?'on':''}" onclick="setG('${k}')">${t}</button>
    `).join('')}
    ${f?`<button class="sm" onclick="setF('')">Bỏ lọc ✕</button>`:''}
  </div>`;

  const list=rows.filter(r=>!f||r.st===f);
  const gk=r=>S.group==='area'?(r.area||'Chưa ghi địa bàn'):S.group==='st'?r.st:DUTY[r.duty];
  const g={};
  list.forEach(r=>(g[gk(r)]=g[gk(r)]||[]).push(r));

  h += rows.length ? Object.keys(g).map(k=>`
    <div class="gh"><span>${esc(k)}</span><span>${g[k].length} người</span></div>
    ${g[k].map(item).join('')}
  `).join('') : `<div class="card"><p class="mut">Hôm nay chưa có lịch trực.</p></div>`;

  app.innerHTML = h;
}

function edit(code){
  const r=S.data.rows.find(x=>x.code===code);
  $('#modal').innerHTML=`<div class="ov"><div class="card">
    <h2>${esc(r.label)}</h2>
    <label class="mut">Trạng thái</label>
    <select id="es">${ST.map(s=>`<option ${s===r.st?'selected':''}>${s}</option>`).join('')}</select>
    ${areaField(r.area)}
    <p class="err" id="em"></p>
    <div class="act" style="margin-top:14px">
      <button style="flex:1" onclick="saveSt('${esc(code)}')">Lưu trạng thái</button>
      <button class="sec" onclick="closeM()">Hủy</button>
    </div>
  </div></div>`;
}

function areaField(cur){
  cur=cur||'';const L=S.areas;
  if(!L.length)return `<label class="mut" style="margin-top:10px;display:block">Địa bàn / ghi chú</label><input id="ea" maxlength="60" value="${esc(cur)}">`;
  const inList=!cur||L.includes(cur);
  return `<label class="mut" style="margin-top:10px;display:block">Địa bàn</label>
  <select id="eas" onchange="$('#ea').style.display=this.value==='__o'?'block':'none'">
    <option value="">(Không chọn)</option>
    ${L.map(a=>`<option ${a===cur?'selected':''}>${esc(a)}</option>`).join('')}
    <option value="__o" ${inList?'':'selected'}>Khác (nhập tay)</option>
  </select>
  <input id="ea" maxlength="60" placeholder="Nhập địa bàn khác" value="${inList?'':esc(cur)}" style="display:${inList?'none':'block'};margin-top:6px">`;
}

function areaVal(){const s=$('#eas');if(!s)return $('#ea').value.trim();return s.value==='__o'?$('#ea').value.trim():s.value}

async function saveSt(code){
  const st=$('#es').value,r=await rpc('set_status',{...auth(),p_target:code,p_st:st,p_area:areaVal()});
  if(!r.ok){$('#em').textContent=r.msg;return}
  closeM();toast('Đã lưu trạng thái');await load();
  if(code===S.data.code&&PROOF.includes(st))proof();
}

async function quickSet(s){
  const d=S.data,me=d.rows.find(r=>r.code===d.code);
  const r=await rpc('set_status',{...auth(),p_target:d.code,p_st:s,p_area:(me&&me.area)||''});
  if(!r.ok)return toast(r.msg);
  toast('Đã cập nhật: '+s);await load();
  if(PROOF.includes(s))proof();
}

function proof(){
  const d=S.data,me=d.rows.find(r=>r.code===d.code);if(!me)return;
  const tb=d.rows.filter(r=>r.duty==='TB'&&r.code!==d.code).map(r=>r.label).join(', ')||'trực ban';
  const msg=`[Báo trực ${fmt(d.day)}] ${me.label} (${me.code}): ${me.st}${me.area?' - '+me.area:''}. Gửi ${tb}, minh chứng đính kèm.`;
  $('#modal').innerHTML=`<div class="ov"><div class="card">
    <h2>Gửi minh chứng Zalo</h2>
    <p class="mut">Bạn đang <b>${esc(me.st)}</b>. Vui lòng gửi ảnh minh chứng cho: <b>${esc(tb)}</b>.</p>
    <label class="mut">Ảnh đính kèm</label>
    <input id="pf" type="file" accept="image/*" multiple>
    <label class="mut" style="margin-top:10px;display:block">Nội dung</label>
    <textarea id="pm" rows="3">${esc(msg)}</textarea>
    <div class="act" style="margin-top:14px">
      <button style="flex:1" onclick="sendZalo()">Mở Zalo gửi</button>
      <button class="sec" onclick="closeM()">Đóng</button>
    </div>
  </div></div>`;
}

async function sendZalo(){
  const msg=$('#pm').value,files=[...$('#pf').files],data={text:msg};
  if(files.length&&navigator.canShare&&navigator.canShare({files}))data.files=files;
  if(navigator.share){try{await navigator.share(data);closeM();return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(msg);toast('Đã chép nội dung. Mở Zalo dán đính kèm.')}catch(e){toast('Hãy tự chép nội dung vào Zalo')}
  window.open('https://zalo.me','_blank');
}

async function nudge(){
  const d=S.data,n=d.rows.filter(r=>r.st===NU).map(r=>r.label+' ('+r.code+')').join(', ');
  const msg=`[Nhắc trực ${fmt(d.day)}] Các đồng chí chưa cập nhật trạng thái: ${n}. Vui lòng cập nhật.`;
  if(navigator.share){try{await navigator.share({text:msg});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(msg);toast('Đã chép lời nhắc, dán vào nhóm Zalo')}catch(e){toast('Hãy chép lời nhắc vào nhóm')}
}

/* Xem tổng quan các ngày */
async function viewOverview(day){
  S.view='ov';
  const r=await rpc('tr_overview',{...auth(),p_day:day||S.ovDay||null});
  if(!r.ok){toast(r.msg);S.view='board';return}
  S.ovDay=r.day;
  const shift=n=>{const t=new Date(r.day+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
  
  let h = renderHeader() + renderNav();
  h += `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <button class="sec sm" onclick="viewOverview('${shift(-1)}')">◀ Trước</button>
      <b style="font-size:1rem">${fmt(r.day)}</b>
      <button class="sec sm" onclick="viewOverview('${shift(1)}')">Sau ▶</button>
    </div>
    <input type="date" value="${esc(r.day)}" onchange="this.value&&viewOverview(this.value)">
  </div>`;

  if(!r.rows.length){
    h += `<div class="card"><p class="mut">Ngày này chưa có lịch trực.</p></div>`;
  } else {
    const done = r.rows.filter(x=>x.st).length;
    h += `<div class="card"><b>Danh sách có ca (${r.rows.length})</b> · Khai báo ${done}/${r.rows.length}</div>`;
    h += r.rows.map(x=>`
      <div class="item">
        <div class="av" style="background:${col(x.st||NU)}">${esc(ini(x.label))}</div>
        <div class="mid">
          <b>${esc(x.label)}</b>
          <div class="meta"><span class="dt">${DUTY[x.duty]||''}</span><span class="mut">${esc(x.code)}</span></div>
        </div>
        <div class="st-badge" style="background:${col(x.st||NU)}15;color:${col(x.st||NU)}">${esc(x.st||NU)}</div>
      </div>
    `).join('');
  }
  app.innerHTML = h;
}

/* Quản trị */
async function viewAdmin(){
  S.view='admin';
  const r=await rpc('admin_list',auth());
  if(!r.ok){toast(r.msg);S.view='board';return}
  const ar=await rpc('get_areas',auth());if(ar.ok){S.areas=ar.areas;S.areasOk=true}
  S.locked=r.officers.filter(o=>o.locked);
  
  let h = renderHeader() + renderNav();
  h += `
    <div class="card">
      <h2>Danh sách cán bộ (${r.officers.length})</h2>
      ${r.officers.map(o=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div>
            <b>${esc(o.code)} - ${esc(o.label)}</b>
            <div class="mut" style="font-size:.75rem">${KIND[o.kind]||o.kind}${o.locked?' · KHÓA':''}</div>
          </div>
          <button class="sec sm" onclick="resetPin('${esc(o.code)}')">Reset PIN</button>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h2>Thêm / Sửa cán bộ</h2>
      <label class="mut">Mã cán bộ</label>
      <input id="oc" autocapitalize="characters" placeholder="CB07">
      <label class="mut" style="margin-top:8px;display:block">Tên cán bộ</label>
      <input id="ol" placeholder="Nguyễn Văn A">
      <label class="mut" style="margin-top:8px;display:block">Loại tài khoản</label>
      <select id="ok">
        <option value="CB">CB: Cán bộ</option>
        <option value="CH">CH: Chỉ huy</option>
        <option value="TR">TR: Trưởng CA</option>
        <option value="QT">QT: Quản trị</option>
      </select>
      <button style="width:100%;margin-top:14px" onclick="saveOff()">Lưu thông tin</button>
    </div>

    <div class="card">
      <h2>Quản lý danh sách địa bàn</h2>
      <textarea id="ar" rows="5">${esc(S.areas.join('\n'))}</textarea>
      <button style="width:100%;margin-top:12px" onclick="saveAreas()">Lưu địa bàn</button>
    </div>

    <div class="card">
      <h2>Nhập lịch trực</h2>
      <p class="mut">Cú pháp: <code>YYYY-MM-DD,MÃ,NHIỆM_VỤ</code> (Ví dụ: 2026-11-14,CB06,TB)</p>
      <textarea id="im" rows="5"></textarea>
      <p class="err" id="ie"></p>
      <button style="width:100%;margin-top:10px" onclick="doImport()">Nhập dữ liệu lịch</button>
    </div>
  `;
  app.innerHTML = h;
}

async function saveOff(){
  const code=$('#oc').value.trim().toUpperCase();
  if(!code||!$('#ol').value.trim())return toast('Cần nhập đủ thông tin');
  const r=await rpc('admin_save_officer',{...auth(),o_code:code,o_label:$('#ol').value.trim(),o_kind:$('#ok').value,o_team:'',o_active:true});
  if(!r.ok)return toast(r.msg);
  if(r.pin)pinBox('PIN tạm của',code,r.pin);else toast('Đã lưu');
  viewAdmin();
}

function pinBox(title,code,pin){
  $('#modal').innerHTML=`<div class="ov"><div class="card">
    <h2>${esc(title)} ${esc(code)}</h2>
    <div class="pin">${esc(pin)}</div>
    <p class="mut">Lưu lại mã PIN này để cấp cho cán bộ đăng nhập lần đầu.</p>
    <button style="width:100%" onclick="closeM()">Đã lưu mã</button>
  </div></div>`;
}

async function resetPin(code){
  if(!confirm('Đặt lại PIN cho '+code+'?'))return;
  const r=await rpc('admin_reset_pin',{...auth(),o_code:code});
  if(!r.ok)return toast(r.msg);
  pinBox('PIN mới của',code,r.pin);viewAdmin();
}

async function saveAreas(){
  const names=$('#ar').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const r=await rpc('admin_save_areas',{...auth(),p_names:names});
  if(!r.ok)return toast(r.msg);
  S.areas=names;toast('Đã lưu danh sách địa bàn');
}

async function doImport(){
  const rows=[];let bad='';
  $('#im').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
    const p=l.split(/[,;\t]/).map(x=>x.trim());
    if(i===0&&!/^\d{4}-\d{2}-\d{2}$/.test(p[0]))return;
    if(p.length===4)p.splice(1,1);
    const day=p[0],code=(p[1]||'').toUpperCase(),duty=(p[2]||'').toUpperCase();
    if(p.length!==3||!/^\d{4}-\d{2}-\d{2}$/.test(day)||!code||!['CH','TB','TC'].includes(duty))bad=bad||'Dòng sai: '+l;
    else rows.push({day,team:TEAM0,code,duty});
  });
  if(bad)return $('#ie').textContent=bad;
  if(!rows.length)return $('#ie').textContent='Chưa có dòng hợp lệ';
  const r=await rpc('admin_import',{...auth(),p_rows:rows});
  if(!r.ok)return $('#ie').textContent=r.msg;
  $('#ie').textContent='';toast('Đã nhập '+r.n+' dòng lịch');$('#im').value='';
}

viewLogin();
</script></body></html>
